        note: "As a county prosecutor, states 'our nation's drug laws do more harm than good' and that the cost to taxpayers to investigate, prosecute, and incarcerate people for marijuana use outweighs the benefits; says decriminalizing marijuana possession and use will be the very first bill he introduces in the Senate."
