      - topic: "Reproductive policy"
        note: "In a detailed interview, describes himself as personally 'pretty radically pro-life' and says that if abortion policy were his call at the state level, 'I would ban all abortion,' allowing he might vote for exceptions 'to limit abortions in an incremental fashion.' As a matter of federal constitutional principle, he holds that Congress has 'zero authority' to regulate abortion and would leave the issue to state legislators rather than act on his personal view at the federal level — but that jurisdictional position sits on top of a clearly stated substantive pro-life view, so the direction is scored accordingly."
