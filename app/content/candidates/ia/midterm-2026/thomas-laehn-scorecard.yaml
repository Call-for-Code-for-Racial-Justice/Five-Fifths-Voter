  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "States he 'would have voted against the big beautiful bill and all these changes,' arguing it is causing Iowans to lose healthcare coverage and will force rural hospital closures. Separately, says he opposes the core of the federal social safety net 'in principle' but would vote to maintain Social Security, Medicare, and Medicaid because they are 'a settled part of the fabric of American life.' These are two distinct, separately stated positions pulling in different directions — ideological opposition to government involvement in healthcare alongside a practical commitment to preserving existing public programs and opposing cuts to them."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: 3
      - topic: "Education"
        note: "Per The Gazette's coverage of his campaign launch, he 'wants to reduce federal involvement in education, social welfare and foreign conflicts' and 'supports eliminating the U.S. Department of Education.' This is a specific, stated position, but it concerns federal-versus-state jurisdiction over education policy rather than the public-funding-versus-school-choice spectrum this taxonomy's tags describe, so it is not stretched into a directional tag."
