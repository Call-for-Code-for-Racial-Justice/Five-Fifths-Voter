  last_updated: "2026-08-09"
  callout: "Thomas Laehn is the Libertarian nominee for Iowa's open U.S. Senate seat and the sitting Greene County Attorney, the first Libertarian elected to partisan office in Iowa. His campaign centers on opposing the two-party system, ending eminent domain abuse (particularly tied to the Summit Carbon Solutions CO2 pipeline), restoring congressional war powers, reducing the national debt, and campaign finance reform (eliminating PAC/super PAC influence), several of which fall outside the taxonomy topics below. He describes himself as personally 'radically' pro-life while holding that abortion regulation is constitutionally a state matter, and says he opposes the federal social safety net in principle but would preserve Social Security, Medicare, and Medicaid as settled parts of American life. He has also criticized Congress for ceding authority to the president via emergency powers, opposed recent tariffs as executive overreach, and supports eliminating the U.S. Department of Education."
