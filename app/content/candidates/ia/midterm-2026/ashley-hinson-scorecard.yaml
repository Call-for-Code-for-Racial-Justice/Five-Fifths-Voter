  callout: "Ashley Hinson is the Republican U.S. Representative for Iowa's 2nd District running for Iowa's open U.S. Senate seat. Her platform emphasizes tax cuts, healthcare price transparency, border enforcement, stricter voter ID requirements, expanded gun rights, and support for Iowa agriculture and biofuels, generally favoring reduced regulation and government spending. She has a long record opposing abortion access, including repeated cosponsorship of the Life at Conception Act, while stating she would not support legislation lacking exceptions for rape, incest, or life of the mother. She also discusses child care access (After Hours Child Care Act), veterans' healthcare, and a ban on members of Congress trading individual stocks, none of which map to taxonomy topics."
