sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Calls for a federal ban on price gouging on food, a minimum wage raise tied to inflation, and closing tax loopholes for billionaires and corporations; platform frames these as active government interventions to lower costs rather than deregulation or market-based approaches."
        coverage: 3
        position_tag: "Government programs"
        position_type: "pos"
        source: 2
      - topic: "Taxation"
        note: "Says 'we gotta tax billionaires and large corporations' and describes current tax burden as unfairly shifted onto the middle class and poor via regressive taxes; platform calls for cutting taxes for the middle class and working families while closing loopholes for billionaires and big corporations — a restructuring of who bears the tax burden rather than a uniform increase or cut."
        coverage: 3
        position_tag: "Restructure tax system"
        position_type: "pos"
        source: 1
      - topic: "Small business & farming"
        note: "Sponsored Iowa legislation to break up monopolies driving up agricultural input costs (HF2727), pass Right to Repair (HF2442), and require Mandatory Country of Origin Labeling (HF2443); platform calls for cracking down on monopolies and agribusiness/meatpacking consolidation to protect small farmers and ranchers, alongside ending tariffs he says have hurt farmers. Notably, when the Senate Agriculture Committee's 2026 Farm Bill stalled after Senate Democrats blocked it in a dispute over SNAP cost-sharing provisions, Turek publicly broke with his own party, saying he 'would have voted in support of this Farm Bill' and criticizing Democrats for 'letting perfect be the enemy of the good' — illustrating the bipartisan approach central to his 'prairie populist' framing."
        coverage: 3
        position_tag: "Increase government support"
        position_type: "pos"
        source: 3
      - topic: "Workers & wages"
        note: "Says the first bill he would sponsor in the Senate is a 'Dignity at Work' bill to raise the minimum wage, eliminate 14(c) subminimum-wage certificates for disabled workers, and restore collective bargaining rights; sponsored Iowa minimum-wage legislation (HF349) and a right-to-organize bill (HF281), and platform supports passing the federal PRO Act."
        coverage: 3
        position_tag: "Raise minimum wage"
        position_type: "pos"
        source: 0

