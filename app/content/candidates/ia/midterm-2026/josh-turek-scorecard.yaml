  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Platform calls for 'cracking down on chemical companies that pollute our water supply' and funding water quality sensors, framed as part of addressing Iowa's cancer crisis; this is a regulatory approach to water pollution specifically, with no broader stated position on energy production (oil, gas, wind, solar)."
        coverage: 2
        position_tag: "Prioritize regulation"
        position_type: "pos"
        source: 2
      - topic: "Immigration"
        note: "Says three things can be true at once: ICE needs reforms (body cams, use-of-force standards, protections for sensitive locations like churches and schools), the country needs 'safe and secure borders,' and there needs to be 'a far easier pathway to citizenship' — citing the bipartisan Dignity Act. Also supports deporting those who commit violent crimes and stopping fentanyl trafficking. These are two distinct, separately evidenced mechanisms — expanded/simplified citizenship pathways and border/interior enforcement — rather than a single-direction position."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: 1
      - topic: "Housing"
        note: "Sponsored Iowa legislation to ban Wall Street private equity firms from buying up single-family homes and farmland (HF745) alongside tax cuts for first-time homebuyers (HF697); platform also calls for simplifying permitting so affordable housing can be built faster. This combines restricting institutional buyers (an intervention) with streamlining permitting to build more supply (reducing a barrier) — two distinct, separately evidenced mechanisms pulling in different directions."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: 2
