  callout: "Josh Turek is a Democratic Iowa state representative and two-time Paralympic gold medalist running for Iowa's open U.S. Senate seat. He describes himself as a 'prairie populist' focused on affordability, workers' rights, health care access, and campaign finance/ethics reform, citing a record of bipartisan legislating in a Republican-leaning Iowa House district. He also discusses disability rights (he is the first permanently disabled member of the Iowa legislature), veterans' issues, and cancer/water-quality policy tied to his sister's cancer diagnosis, some of which fall outside the taxonomy topics below."
