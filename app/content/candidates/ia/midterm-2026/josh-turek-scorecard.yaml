  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "States directly that he believes 'we should arrive ultimately at a public option' while allowing people to keep private doctors and hospitals if they choose; platform also calls for protecting and expanding the ACA, restoring Medicaid funding, and letting Medicare negotiate drug prices — an expansion of public coverage options alongside the existing private system."
        coverage: 3
        position_tag: "Expand public coverage"
        position_type: "pos"
        source: 0
      - topic: "Education"
        note: "Sponsored Iowa legislation to repeal school vouchers (HF199) and require transparency around nonpublic school accreditation (HF251); platform calls for ending school vouchers, restoring Department of Education funding, and increasing public school funding, framed as keeping public dollars in public schools."
        coverage: 3
        position_tag: "Increase public school funding"
        position_type: "pos"
        source: 2
