        note: "KCCI interview: focuses on cancer prevention, independent safety testing of farm chemicals, state contract pricing for early cancer detection tests, and supports ending school vaccine requirements, saying it is \"a decision between parents and doctors\" [00:07:36]. CBS: \"food is medicine.\" Medicaid, insurance and coverage were not addressed in reviewed sources, so no position on how Iowans access care."
