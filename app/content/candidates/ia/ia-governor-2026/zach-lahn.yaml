sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Debate: says consolidation in seed, healthcare and groceries is the foundational cause of high prices, and proposes to \"increase the budget for the attorney general's office, specifically earmarked for anti-competition lawsuits\" to \"lower prices and give Iowans more choice\" [00:09:48]-[00:11:07]. Also cited a push for red-dye diesel use on roads to cut farmer fuel costs [00:07:48]. CBS: \"A monopoly is a failure of the free market.\""
        coverage: 3
        position_tag: "Centrist or alternative approach"
        position_type: "pos"
        source: [0, 3]
      - topic: "Taxation"
        note: "Debate: \"I'm here to cut taxes. We need to do it fiscally responsibly\" [00:15:53]; long-term goal for Iowa to be \"the very first state in the country to fully eliminate property taxes on primary residential homes\" [00:52:17]; would end all data center tax breaks [00:09:08]. Campaign site: lower the tax burden on Iowa families, raise it on out-of-state institutional investors, and tax rebates for young Iowans who buy a home."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 4]
      - topic: "Small business & farming"
        note: "Debate: two distinct mechanisms. Government support: a program through the Iowa Economic Development Authority to help farmers transition into cattle, funding to the attorney general for antitrust suits, and a goal of 80% Iowa-grown food in schools [00:38:49]. Deregulation: \"We need to start to deregulate some of these things for small processors\" [00:40:14]. Campaign site: low-interest financing and mentorship for young farmers, a goal of 10,000 new family farms in four years."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [0, 4]
      - topic: "Workers & wages"
        note: "Asked in the debate whether he would consider raising the minimum wage, he answered about market consolidation and did not state a position on the minimum wage [00:09:46]. Campaign site lists putting Iowans first for state government and public university jobs and farmers' right to repair. No stated position on wages, minimum wage or worker protections found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

