      - topic: "Education"
        note: "Debate: \"I truly believe [education savings accounts] are foundational. Parents deserve to have more say over where their kids go to school\" [00:24:30], while also proposing innovation zones within public schools and reduced red tape, and calling the public school system in need of overhaul [00:22:48]. Said \"the issue is not just funding\" [00:22:42] and did not commit to a funding level. Campaign site: strengthen public schools, reduce standardized testing, mastery-based learning."
        coverage: 3
