  callout: "Zach Lahn is a first-time candidate and the Republican nominee for governor. He is a sixth-generation Iowan who has worked in business, education and his family farm, and he won the June primary over Rep. Randy Feenstra. His campaign centers on Iowa's cancer rate and water quality, saving family farms through antitrust enforcement, education reform with support for education savings accounts, keeping young Iowans in the state, and property tax cuts. He also supports ending the school vaccine requirement and eliminating tax breaks for data centers, which are outside the scorecard taxonomy."
