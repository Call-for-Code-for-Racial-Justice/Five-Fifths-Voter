  callout: "Rob Sand is Iowa's two-term State Auditor and a former assistant attorney general who prosecuted public corruption cases. His campaign emphasizes bipartisan governing, government accountability (term limits, a stock-trading ban, mandatory town halls, a single open primary with approval voting), ending Medicaid privatization, public school funding with voucher oversight, and water quality. He also supports legalizing and taxing cannabis, which is outside the scorecard taxonomy."
