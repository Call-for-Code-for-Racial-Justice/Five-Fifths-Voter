  callout: "Nixon is a Florida state representative from Jacksonville and a former community and SEIU union organizer who won the 2026 Democratic primary over Alex Vindman. Her platform emphasizes Medicare for All, universal childcare, a wealth tax, rent stabilization and union rights. She is a member of the Democratic Socialists of America but says she does not consider herself a socialist and rejects abolishing the Senate, abolishing prisons, or writing a new constitution. Her platform also includes positions outside the scorecard taxonomy, such as overturning Citizens United, limits on surveillance data, and guardrails on AI and data centers."
