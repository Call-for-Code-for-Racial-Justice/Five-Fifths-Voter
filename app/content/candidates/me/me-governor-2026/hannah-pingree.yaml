  callout: "Hannah Pingree is the Democratic nominee and a former Maine House Speaker who served as director of Gov. Janet Mills' Office of Policy Innovation and the Future and co-chaired the Maine Climate Council. Her platform centers on housing ($100 million a year and a 90-day permit shot clock), a state-backed public health insurance option, property tax relief, and clean energy with utility accountability. She also supports a data center moratorium, which falls outside the scorecard taxonomy."
