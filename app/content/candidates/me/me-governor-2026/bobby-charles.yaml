sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "In the interview he ties affordability to property taxes, income taxes, and energy costs, and to rolling back unfunded mandates [00:03:44]-[00:05:34]. He also said he would seek a White House waiver on Canada tariffs because 'it's costing us 20%' [00:24:08]. The solutions he names are tax cuts, mandate rollbacks, and lower energy costs rather than new programs."
        coverage: 2
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: [0, 5]
      - topic: "Taxation"
        note: "Campaign Issues page: he 'pledges to abolish the state income tax.' Spectrum (May 2026): he would eliminate the income tax over a four-year term. In the interview he says he can cut 'a billion dollars out of this budget in the first year' and wants to cut property taxes by removing unfunded mandates [00:04:36]. He also criticizes the 2% surcharge [00:20:34]. A campaign news release cited on the home page describes a $100,000 homestead exemption reimbursed by the state."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 3, 5]
      - topic: "Small business & farming"
        note: "In the interview he says Maine should 'get the regulations down, get the taxes down, incentivize these new sectors' such as cross-laminated timber, lobster processing, and aviation at the former Loring base [00:25:57]-[00:26:12]. That pairs regulation and tax cuts with targeted incentives. He also names lobstering, agriculture, and logging as legacy industries [00:48:03]."
        coverage: 2
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [0]
      - topic: "Workers & wages"
        note: "No position found in reviewed sources. He says the 2% income tax surcharge may cost 8,000 to 16,000 jobs [00:20:34], and the Spectrum May article says he supports investing in trade programs in schools, but neither is a stated position on wages or worker protections."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "civil-rights-justice"
    title: "Civil rights & justice"
    items:
      - topic: "Criminal justice system"
        note: "Campaign Issues page: dismantle cartel networks, strengthen and rebuild law enforcement, and enforce strict public safety policies, alongside more addiction recovery and mental health support. In the interview he wants to 'get rule of law back on the streets,' get the drug traffickers out [00:07:25], pursue federal HIDTA status for Maine counties [00:17:56], and criticizes needle distribution [00:22:52]. The emphasis is on enforcement."
        coverage: 3
        position_tag: "Increase enforcement"
        position_type: "pos"
        source: [0, 5]
