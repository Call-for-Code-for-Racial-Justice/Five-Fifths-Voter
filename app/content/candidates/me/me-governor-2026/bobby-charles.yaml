  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Spectrum (May 2026): he supports work requirements for MaineCare and named MaineCare among budget cut targets. Spectrum (Sep 2026): 'I am going to completely dismantle DHHS, from top to bottom.' The BDN debate recap reports he blamed Mills-administration officials for MaineCare fraud and cost overruns. No broader coverage plan was found."
        coverage: 2
        position_tag: "Reduce government role"
        position_type: "pos"
        source: [3, 2]
      - topic: "Education"
        note: "Campaign Issues page: refocus on reading, math, and science, remove 'woke' content, support teachers and educational freedom, and require curriculum transparency. Interview: Maine schools fell from best in 1992 to near the bottom, 'We have disempowered teachers... disempowered parents in favor of the bureaucracy in Augusta' [00:21:35], and he wants a return to basics and the trades. Spectrum (Sep): 'We need to empower teachers and disempower the bureaucracy.' No stated position on school funding levels or school choice programs."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Broadband & infrastructure"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Interview: criticizes state renewable subsidies and large solar and wind projects ('horizon to horizon solar cells and blowing the tops of mountains off') [00:31:07], and net energy billing costs [00:26:05]. Campaign Issues page: 'restore reliable, affordable power' with energy experts in charge. Spectrum (May): 'wood and biomass have an extraordinary future in this state.' The BDN recap notes he disagrees with Trump administration efforts to roll back power plant emission standards."
        coverage: 3
        position_tag: "Prioritize energy production"
        position_type: "pos"
        source: [0, 1, 3, 5]
      - topic: "Immigration"
        note: "Interview: 'Get the illegal aliens out of here' [00:07:25] and criticism of the state law limiting local cooperation with federal immigration authorities [00:29:34]. Spectrum (Sep) and BDN (debate): he blamed that law for poor outcomes, saying 'State and local and federal law enforcement should always be talking to each other.' Campaign Issues page lists strict immigration policies. Spectrum (May): he would end state housing funding for people not legally in the country."
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: [0, 1, 2, 3, 5]
      - topic: "Housing"
        note: "Spectrum (May 2026): his housing approach is to cut property and income taxes and end state funding for housing for people not legally in the country. In the interview he cites young workers' income falling below median rent [00:27:48] but does not lay out a housing program. Neither a government-programs position nor a development-barriers position is stated."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
