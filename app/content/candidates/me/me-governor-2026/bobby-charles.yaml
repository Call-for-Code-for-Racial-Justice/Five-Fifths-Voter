  callout: "Bobby Charles is the Republican nominee for governor. He describes a career as a federal investigator and litigator, Navy intelligence officer, congressional and Reagan White House staffer, and small-business owner. His campaign centers on cutting property and income taxes (he pledges to eliminate the state income tax), cutting crime and drug trafficking, stricter immigration enforcement, lowering energy costs, and rooting out fraud, including a pledge to dismantle DHHS. He has also said he differs with President Trump on Canada tariffs. Notable positions outside the taxonomy include a pledge to cut about $4 billion from the state budget."
