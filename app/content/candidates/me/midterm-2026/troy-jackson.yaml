  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "In the gubernatorial-era interview, Jackson said pursuing clean energy made 'here in Maine' is smart, citing volatility from relying on other countries/regions for fuel, and discussed a transmission line project to sell Maine's clean energy to other states rather than cede ownership to them. He favored tax incentives for clean energy adoption over shifting costs onto ratepayers. This combines a pro-clean-energy stance with a market/ownership framing rather than emphasizing regulation alone."
        coverage: 2
        position_tag: "Prioritize regulation"
        position_type: "pos"
        source: 1
      - topic: "Immigration"
        note: "NPR reports Jackson is pushing for the abolishment of Immigration and Customs Enforcement (ICE), aligning him with other progressive candidates on the left. No broader position on legal immigration pathways was stated in reviewed sources."
