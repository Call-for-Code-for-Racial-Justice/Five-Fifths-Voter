      - topic: "Reproductive policy"
        note: "NPR reports Jackson advocates for Congress to federalize the right to an abortion. CNN reports he currently supports establishing a federal right to abortion, co-sponsored a 2023 Maine law allowing abortions after fetal viability when a doctor determines it is medically necessary, and received a 100% rating from Planned Parenthood's Maine chapter in 2023. CNN also documents that he held sweeping anti-abortion positions in candidate questionnaires in 2004 and 2010, including answering that abortion should never be legal; his stated position has since reversed."
