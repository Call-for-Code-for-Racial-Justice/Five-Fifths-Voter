  callout: "Jackson is a former Maine Senate President and longtime state legislator from Allagash, and a fifth-generation logger, who became the Democratic Senate nominee after Graham Platner withdrew, winning 566 of 571 delegate votes at a special nominating convention. He runs on an economic populist platform emphasizing affordability, Medicare for All, and higher taxes on the ultra-wealthy and large corporations. He also supports ending U.S. military aid to Israel, a foreign policy position outside this taxonomy. Reporting notes he has reversed earlier conservative positions on abortion and LGBTQ+ rights held during his early years in public office."
