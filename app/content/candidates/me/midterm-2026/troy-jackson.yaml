  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Jackson said in the MS Now interview he has been 'fighting for universal health care, prescription drug coverage.' In the earlier interview he elaborated at length: he supports Medicare for All and a public option, sponsored bipartisan prescription drug pricing bills (vetoed by Gov. Mills) that he said cut roughly 50% of drug costs, said healthcare 'is not... a for profit industry,' and said he would 'go after private equity in our hospitals in our nursing homes.' NPR confirms Medicare for All is part of his Senate platform."
        coverage: 3
