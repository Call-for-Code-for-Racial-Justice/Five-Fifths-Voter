sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "In the gubernatorial-era interview, Jackson discussed rising electricity costs and proposed selling Maine's clean energy surplus to neighboring states (Massachusetts, Rhode Island, Connecticut) rather than ceding ownership, as a way to lower in-state energy costs; he also favored tax incentives for clean energy over placing costs directly on ratepayers, and named property tax reform as a major affordability issue. NPR reports his Senate platform centers on affordability concerns."
        coverage: 2
        position_tag: "Government programs"
        position_type: "pos"
        source: 1
      - topic: "Taxation"
        note: "In the MS Now interview, Jackson stated plainly: 'I don't believe in income tax cuts for wealthy people,' contrasting himself with Collins and Trump. NPR reports his platform backs raising taxes on the ultra-wealthy and large corporations."
        coverage: 3
        position_tag: "Increase taxes"
        position_type: "pos"
        source: 2
