      - topic: "Workers & wages"
        note: "Jackson repeatedly emphasized his labor background and record, saying in the MS Now interview 'I'm a big labor person. I believe that workers need to have somebody in their corner,' and in the earlier interview described fighting 'for workers in the legislature' and walking picket lines. No specific mechanism (minimum wage level, specific protection, or deregulation) was named in either source."
        coverage: 2
        position_tag: "Expand worker protections"
        position_type: "pos"
