        note: "Collins stated in the interview: 'I disagreed with the Supreme Court's decision overturning Roe v. Wade,' while also noting Roe would have been overturned regardless of how she voted on Kavanaugh given the court's split. Older clips replayed in the same video show her defending her Kavanaugh vote by citing his statements that Roe was 'settled law' and that she would not support a nominee 'hostile' to Roe. Taken together, her own words in this source describe a pro-choice position, though the note reflects an incumbent explaining a contested past vote rather than a forward-looking policy commitment."
