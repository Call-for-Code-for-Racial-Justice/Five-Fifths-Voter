  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Collins introduced the bipartisan INSULIN Act with Sens. Shaheen, Kennedy, and Warnock, which would cap insulin costs at $35/month for Americans on private and employer-sponsored insurance and create a pilot program offering insulin at the same cost to uninsured Americans. In floor remarks she described a Maine constituent who nearly died rationing insulin she couldn't afford, and framed the bill as fixing 'fundamental flaws in the insulin market and the FDA approval process.' This is a specific market-affordability regulation paired with a targeted access program for the uninsured — a distinct approach that doesn't map to 'expand public coverage' or 'expand private options' as defined."
        coverage: 3
        position_tag: "Centrist or alternative approach"
        position_type: "pos"
        source: 1
