  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Playbook 2.0 lists 'Protect the health of our aquifer' and 'Protect Nebraska's public power ratepayers.' Pillen told KNOP data centers must build their own power infrastructure and cannot affect water, and said past over-watering and fertilizer caused water quality problems. He told WOWT 'We did not need to give the topsoil away' on data center tax incentives. No single regulation-versus-production tag is directly supported."
        coverage: 3
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Immigration"
        note: "Told Catholic World Report he supports Trump's border security and deportation of immigrants who commit serious crimes, and defended converting a McCook prison into an immigration detention facility: 'we had every right to do what we did.' Playbook 2.0 lists eliminating 'state taxpayer benefits for illegals.'"
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: [3, 4]
      - topic: "Housing"
        note: "In the NTV interview he ties high property taxes to housing costs, saying young people have 'lost the hope of the American dream of owning their own home' [00:00:35] and that rents rise because of property taxes [00:00:49]. Playbook 2.0 lists 'Expand availability of workforce housing' and 'Stop hedge funds from buying up our homes.' No single taxonomy tag is directly supported."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
