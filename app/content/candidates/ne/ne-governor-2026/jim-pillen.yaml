  callout: "Jim Pillen is the incumbent Republican governor, sworn in January 2023. He is a veterinarian and founder of Pillen Family Farms who served on the University of Nebraska Board of Regents from 2013 to 2023. His 2026 platform, the Pillen Playbook 2.0, centers on property tax reform, ending data center tax incentives, K-12 funding reform, and what he calls defending Nebraska values. He has said he does not debate opponents."
  data_note: "The only long-form 1-1 interview with a usable transcript is from 2024 and covers mainly the property tax special session; later positions rely on 2026 news excerpts and campaign materials. The Central Nebraska Today Playbook interview could not be accessed (HTTP 403)."
