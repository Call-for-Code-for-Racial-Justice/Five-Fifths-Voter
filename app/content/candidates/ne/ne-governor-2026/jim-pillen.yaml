      - topic: "Reproductive policy"
        note: "Told Catholic World Report 'Pro-life is everything.' He credited faith-based groups for the 2024 ballot measure protecting unborn children at 12 weeks and said the state will go lower in 2027. Playbook 2.0 lists 'Protect life.'"
        coverage: 3
        position_tag: "Pro-life"
        position_type: "pos"
        source: [3, 4]
      - topic: "Voting & elections"
        note: "Playbook 2.0 lists 'Protect the integrity of our elections and reform the broken ballot petition process.' The home page letter supports bringing back 'Winner Take All' legislation for Nebraska's electoral votes. No specific voter ID or ballot access policy was found, so no tag is applied."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Gun policy"
        note: "Playbook 2.0 lists 'Protect the 2nd Amendment' with no specific policy detail."
        coverage: 1
        position_tag: "Maintain current laws"
        position_type: "pos"
        source: [4]
      - topic: "LGBTQ+ policy"
        note: "Told KNOP he supports a constitutional amendment requiring athletes to compete according to the gender assigned at birth. Playbook 2.0 lists 'Keep boys out of girls' sports.' WOWT reports he supports protecting girls' sports and opposes surgeries for minors, and quotes him: 'I love a transgender adult just like any other Nebraskan.'"
        coverage: 3
        position_tag: "Limit or oppose expansions"
        position_type: "pos"
        source: [1, 2, 4]

  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Playbook 2.0 includes 'Making Nebraska Healthy Again' with 'Eliminate toxins in our food' and 'Eliminate toxins in our water.' No position found in reviewed sources on coverage, insurance, or the government's role in healthcare."
        coverage: 1
