      - topic: "Education"
        note: "In the NTV interview he says the state must 'step up and provide the funding for K12 education' so costs come off property taxpayers [00:02:48], and that the state should 'quit quitting on kids' [00:02:38]. Playbook 2.0 says to 'Reform K-12 Funding... to strengthen public schools and give them the resources they need,' and to ensure every 3rd grader can read on grade level."
        coverage: 3
        position_tag: "Increase public school funding"
        position_type: "pos"
