sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Playbook 2.0 lists 'Increasing affordability' goals: eliminate tax incentives for Big Tech data centers, lower property insurance rates, cut government spending, and stop hedge funds from buying up homes. These are a list of goals without a stated overall approach, so no single tag is applied."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Taxation"
        note: "In the NTV interview he calls property taxes a crisis and backs hard caps on local spending at zero or CPI growth, with overrides by a vote of the people [00:03:20]. He proposes broadening the sales tax, including a sales tax on new farm equipment in exchange for no personal property tax on it [00:04:52]. He rules out sales tax on food, medicine, and nonprofits [00:10:24]. In 2026 he calls 'transformative property tax reform' a Playbook goal and told WOWT major property tax relief is a second-term priority."
        coverage: 3
        position_tag: "Restructure tax system"
        position_type: "pos"
        source: [0, 1, 4]
      - topic: "Small business & farming"
        note: "Playbook 2.0 says 'Defend our farmers and ag lands' and 'Expand trade opportunities for agricultural products.' The home page letter mentions standing up for farmers and ranchers and eliminating red tape, with few specifics. No single tag from the taxonomy is directly supported."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Workers & wages"
        note: "Playbook 2.0 lists 'Continue to strengthen our Community Colleges' and 'Expand availability of workforce housing.' No position found in reviewed sources on minimum wage, worker protections, or labor regulation."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

