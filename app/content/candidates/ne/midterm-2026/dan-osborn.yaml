  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "No position found in reviewed sources on energy production or environmental regulation. Platform criticism of AI data centers' electricity demand is framed as a consumer-cost and utility-fairness issue, not an energy-production or environmental-regulation position."
        coverage: 0
