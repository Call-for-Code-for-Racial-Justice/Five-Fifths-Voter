        position_type: "none"
        source: null
      - topic: "Immigration"
        note: "At the Sept. 2026 debate, Osborn said he agreed with the 'basic mission' of ICE -- keeping communities safe -- and said Biden had failed on border security, but called the increased ICE budget 'wasteful spending' and said he would support increased training and accountability measures such as requiring body cameras for ICE officers, saying 'we should never get used to troops in our streets.' This combines support for enforcement's core mission with a distinct accountability-reform agenda, rather than a blanket stricter-enforcement or expanded-pathways position."
        coverage: 3
        position_tag: "Centrist or alternative approach"
        position_type: "pos"
        source: 0
      - topic: "Housing"
        note: "Platform's 'Good Jobs and Affordable Housing' pillar pledges to 'fight private equity tooth-and-nail' to prevent large investors from buying up Nebraska housing stock, framed as a government-intervention approach to affordability; no detailed legislative mechanism specified beyond this general commitment."
        coverage: 2
