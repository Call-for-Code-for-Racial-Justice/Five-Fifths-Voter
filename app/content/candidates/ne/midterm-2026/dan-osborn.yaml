  callout: "Dan Osborn is a Nonpartisan/independent candidate for U.S. Senate in Nebraska, a former industrial mechanic and union leader (BCTGM Local 50G) who led the 2021 Kellogg's strike in Omaha and previously served in the U.S. Navy and Nebraska Army National Guard. He narrowly lost a 2024 Senate bid to Sen. Deb Fischer and is now challenging incumbent Republican Pete Ricketts. His platform centers on anti-corruption reform, protecting Social Security and worker pay, and breaking up corporate consolidation in healthcare and agriculture."
