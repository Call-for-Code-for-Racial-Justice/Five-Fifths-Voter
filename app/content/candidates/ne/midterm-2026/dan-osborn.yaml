sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Osborn's platform proposes multiple government-regulatory interventions to lower everyday costs: the bipartisan Credit Card Competition Act to break up the Visa-Mastercard duopoly on swipe fees, the Shrinkflation Prevention Act requiring companies to disclose package-size reductions, the Unsubscribe Act requiring one-click cancellation, a ban on 'surveillance pricing' using personal data to charge different customers different prices, and a 'smart, targeted' (not blanket) tariff policy."
        coverage: 3
        position_tag: "Government programs"
        position_type: "pos"
        source: 5
      - topic: "Taxation"
        note: "Supports a 'real middle class tax cut' lowering rates on wage income and expanding credits, paired with closing loopholes that let top earners and corporations pay little or no federal income tax -- explicitly combining tax relief at the bottom/middle with increased taxation at the top rather than an across-the-board cut."
        coverage: 3
        position_tag: "Restructure tax system"
        position_type: "pos"
        source: 5
      - topic: "Small business & farming"
        note: "At a Clearwater campaign stop and in his 'Protect Family Farms, Ranchers and Small Businesses' platform pillar, Osborn pledged to fight corporate monopolies and private equity 'carving up' Nebraska, enforce the Packers and Stockyards Act, and pass right-to-repair laws for farm equipment -- a regulatory/enforcement approach aimed at supporting small producers against consolidation."
        coverage: 3
        position_tag: "Increase government support"
        position_type: "pos"
        source: 1
      - topic: "Workers & wages"
        note: "Platform supports banning non-compete agreements for ordinary workers (citing the FTC's proposed 2024 rule), opposes wage-suppressing corporate practices, and supports targeted (not blanket) tariffs specifically to protect American manufacturing jobs."
        coverage: 3
        position_tag: "Expand worker protections"
        position_type: "pos"
        source: 5

