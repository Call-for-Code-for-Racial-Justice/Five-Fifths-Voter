  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Osborn's platform centers on the bipartisan Break Up Big Medicine Act, a 'Glass-Steagall approach to healthcare' requiring insurers, providers, and pharmacies to be separately owned to eliminate vertical-integration conflicts of interest; he also supports giving Medicaid authority to negotiate drug prices directly (as the VA already does) and protecting independent doctors and pharmacies. This is a competition/antitrust-focused approach that is neither an expansion of public coverage nor of private options."
        coverage: 3
        position_tag: "Centrist or alternative approach"
        position_type: "pos"
        source: 5
