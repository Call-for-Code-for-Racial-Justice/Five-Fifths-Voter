  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "In Senate floor remarks outlining his 2025 priorities, Ricketts said Senate Republicans need to 'unleash American energy and lower prices for consumers,' criticized the prior administration's environmental rulemaking (citing over 5,000 new rules including an EV mandate he called 'delusional'), and said he would work to reverse these as a member of the Environment and Public Works Committee."
        coverage: 3
        position_tag: "Prioritize energy production"
        position_type: "pos"
        source: 4
      - topic: "Immigration"
        note: "In a Senate floor speech urging DHS funding, Ricketts defended continued ICE and Border Patrol operations, opposed Democrats' proposed rollback of administrative warrants (calling it 'a non-starter'), defended agents' use of masks, and credited the administration with a 95% drop in daily illegal border crossings. Campaign materials cite votes for $46.5 billion in border security funding and hiring 16,000 additional Border Patrol agents."
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: 1
      - topic: "Housing"
        note: "In a floor speech on the ROAD to Housing Act, Ricketts framed housing costs as driven largely by 'red tape and regulations' (up to 40% of the cost of an apartment development) and pushed deregulation and streamlining of HUD/USDA rural housing rules -- while also touting the same bill's permanent increase to the Low-Income Housing Tax Credit as a government-support mechanism to fund affordable housing construction. These are two distinct, separately evidenced mechanisms (deregulation and an expanded tax-credit program)."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: 2
