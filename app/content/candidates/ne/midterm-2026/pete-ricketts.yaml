sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "At the Sept. 2026 debate, Ricketts defended Trump-era tariffs as leveling the playing field for U.S. producers and said he wants to keep using tariffs to protect Nebraska agriculture -- a government trade-intervention mechanism. Separately, in floor remarks and campaign materials he credits the Working Families Tax Cuts (2025 reconciliation bill) with putting more money in Nebraskans' pockets and preventing a $2,400 tax increase, a market-driven/reduced-taxation mechanism. These are two distinct, separately evidenced approaches pulling from different directions (trade protection vs. tax relief)."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: 0
      - topic: "Taxation"
        note: "Extensive record of supporting tax reduction: as governor, phased out state taxes on Social Security and military retirement and cut income taxes; in the Senate, backed the Working Families Tax Cuts (no tax on tips/overtime, expanded child tax credit, permanent small-business and estate-tax relief for ag producers, and eliminating federal Social Security taxes for 88% of seniors)."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: 7
      - topic: "Small business & farming"
        note: "At the Sept. 2026 debate, Ricketts said expanding U.S. cattle herd size -- not short-term tariff waivers on imported beef -- is the real solution to lower beef prices, and cited his continued use of tariffs to protect Nebraska agriculture from foreign competition; he noted his endorsement by the Nebraska Farm Bureau. This reflects a government-support/protectionist approach to agricultural markets rather than deregulation."
        coverage: 3
        position_tag: "Increase government support"
        position_type: "pos"
        source: 0
      - topic: "Workers & wages"
        note: "No position found in reviewed sources on minimum wage or general worker-protection legislation. Worker-directed provisions mentioned (no tax on tips/overtime, expanded child tax credit) are tax-policy measures, addressed under Taxation, not a standalone wages/protections position."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "civil-rights-justice"
    title: "Civil rights & justice"
    items:
      - topic: "Criminal justice system"
        note: "Campaign site states Ricketts has 'always stood with law enforcement and against soft-on-crime policies,' opposed calls to defund police, invested in law enforcement training and crime lab upgrades as governor, and in the Senate backs the Back the Blue Act and Thin Blue Line Act (harsher penalties for targeting officers) and funding to combat fentanyl."
        coverage: 3
        position_tag: "Increase enforcement"
        position_type: "pos"
        source: 8
      - topic: "Reproductive policy"
        note: "Per Nebraska Examiner reporting, Ricketts helped fund the successful 2024 ballot measure banning abortion after the first trimester and has sponsored a bill making it a federal crime to transport a minor across state lines for an abortion without parental consent."
        coverage: 3
        position_tag: "Pro-life"
        position_type: "pos"
        source: 6
      - topic: "Voting & elections"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Gun policy"
        note: "Campaign website states Ricketts 'fought back against the Biden administration's efforts to infringe on our 2nd Amendment rights,' framed as defending existing gun rights rather than a specific expansion proposal; no detailed legislative specifics found."
        coverage: 2
        position_tag: "Maintain current laws"
        position_type: "pos"
        source: 9
      - topic: "LGBTQ+ policy"
        note: "Campaign website states Ricketts 'worked to protect our commonsense Nebraska values by voting to ban men from competing in women's sports,' a specific, named policy position limiting transgender inclusion."
        coverage: 3
        position_tag: "Limit or oppose expansions"
        position_type: "pos"
        source: 9

  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "In Nov. 2025, Ricketts told the Nebraska Examiner that Democrats were holding the government shutdown hostage over 'pandemic-era subsidies' (enhanced ACA marketplace tax credits) and that Republicans were willing to discuss the issue after reopening government, but he 'didn't answer a direct question of whether he would support or oppose efforts to extend the tax credits.' No clear position found."
        coverage: 2
