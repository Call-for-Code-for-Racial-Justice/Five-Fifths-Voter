  - id: "civil-rights-justice"
    title: "Civil rights & justice"
    items:
      - topic: "Criminal justice system"
        note: "Alme's plan combines two distinct mechanisms: enforcement (as U.S. Attorney, he says criminal prosecutions of violent criminals and drug traffickers reached a 20-year high, and he supports pursuing drug trafficking organizations 'all the way up to the cartels') and prevention/treatment investment (as Montana's Budget Director he helped create the HEART Fund, using marijuana tax revenue to expand mental health and substance use treatment and recovery services, which he says he will bring 'a renewed focus' to as Senator)."
