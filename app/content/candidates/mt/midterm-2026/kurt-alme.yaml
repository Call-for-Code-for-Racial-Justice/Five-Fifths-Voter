  last_updated: "2026-08-22"
  callout: "Kurt Alme is a former Montana budget director, state revenue director, and twice-confirmed U.S. Attorney for Montana who was recruited into the race by retiring Sen. Steve Daines just before the March 2026 filing deadline, and has since secured endorsements from President Trump, Daines, and Gov. Greg Gianforte. His platform centers on fiscal restraint (citing his record cutting state income taxes and balancing budgets), reducing regulation to spur housing construction, tough-on-crime prosecution paired with drug treatment and prevention investment (the HEART Fund), and energy independence. He supports the Trump administration's approach to Iran and continued tariff use as a negotiating tool, while acknowledging tariffs, fertilizer, and oil costs have created a 'one-two punch' for Montana ranchers and producers. Reviewed sources did not address his positions on reproductive policy, gun policy, LGBTQ+ policy, voting and elections, education, broadband/infrastructure, or worker wage and labor policy."
