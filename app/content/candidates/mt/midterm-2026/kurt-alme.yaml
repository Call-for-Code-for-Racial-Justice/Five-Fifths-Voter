sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Alme says the best way to permanently lower costs is to 'rein in deficit spending' and restore fiscal responsibility, citing his record balancing Montana's budget and cutting wasteful spending. On housing specifically, he says increasing supply requires 'cutting red tape that ties up construction' so government gets 'out of the way.'"
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: 1
      - topic: "Taxation"
        note: "As Montana's Revenue Director, Alme says he 'spearheaded' the largest state income tax rate cut in history (cutting the top rate by almost 40%), and as Budget Director delivered $60 million in annual tax reductions while making the state debt-free."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: 0
      - topic: "Small business & farming"
        note: "Alme supports 'unleashing small businesses, contractors, and communities' by cutting regulatory red tape that limits housing construction. On farming, he discusses tariffs' impact on ranchers and producers and says he hopes the president continues to use tariffs 'selectively' as a negotiating tool to open foreign markets for Montana crops and cattle, rather than opposing tariffs generally."
        coverage: 3
        position_tag: "Reduce regulation"
        position_type: "pos"
        source: 1
