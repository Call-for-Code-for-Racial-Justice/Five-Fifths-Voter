sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Bankhead frames affordability as a top priority, proposing to redirect unspent 'use-or-lose' Pentagon year-end funds toward domestic needs, calling for Medicaid for All funded partly this way, and saying in the debate that 'everybody should pay their fair share of taxes' to bring resources 'down to the Main Street.'"
        coverage: 3
        position_tag: "Government programs"
        position_type: "pos"
        source: 0
      - topic: "Taxation"
        note: "Bankhead supports removing the Social Security payroll tax cap so higher earners 'pay their fair share,' and in the debate said 'everybody should pay their fair share of taxes' in the context of addressing wealth inequality."
        coverage: 3
        position_tag: "Increase taxes"
        position_type: "pos"
        source: 1
      - topic: "Small business & farming"
        note: "Bankhead makes only a brief, general reference to 'taking care of our agriculture community' as one of several 'common sense' Montana Democrat values, without a specific farming or small-business policy proposal in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: 1
      - topic: "Workers & wages"
        note: "Bankhead states 'I'm very pro-union' while discussing a proposed data center moratorium, though she does not detail a specific worker-protection or minimum-wage policy beyond this."
        coverage: 2
        position_tag: "Expand worker protections"
        position_type: "pos"
        source: 1

