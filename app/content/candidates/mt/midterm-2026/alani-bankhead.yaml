        note: "Bankhead's career centers on prosecuting child predators, traffickers, and corrupt officials, and she emphasizes 'accountability' broadly, but reviewed sources do not include a general position on incarceration levels, sentencing, or crime-prevention policy beyond her specific law-enforcement background."
