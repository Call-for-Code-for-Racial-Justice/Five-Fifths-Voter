  callout: "Alani Bankhead is a retired U.S. Air Force lieutenant colonel and special agent who spent over two decades investigating child exploitation, trafficking, and counterintelligence cases before entering politics for the first time, winning Montana's crowded 2026 Democratic Senate primary. Her platform centers on military-budget accountability (proposing to redirect unspent, 'use-or-lose' Pentagon funds toward healthcare and housing), opposition to the Trump administration's war in Iran as unauthorized by Congress, and a Medicaid-for-All-style expansion of public healthcare. She has faced sustained pressure from national and state Democratic Party figures to withdraw from the race in favor of independent candidate Seth Bodnar, which she has repeatedly refused, and has publicly objected to unsolicited super PAC ad spending on her behalf as money she neither sought nor controls. Reviewed sources did not address her positions on small business or farming policy generally, general criminal justice/incarceration policy, voting and elections, education, broadband/infrastructure, or LGBTQ+ policy."
