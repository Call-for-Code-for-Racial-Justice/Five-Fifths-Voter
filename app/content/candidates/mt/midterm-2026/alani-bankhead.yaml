  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Bankhead says she supports a moratorium on new data centers, citing concerns raised at the state party convention, stating 'I do' support a two-year moratorium against them."
        coverage: 2
        position_tag: "Prioritize regulation"
        position_type: "pos"
        source: 1
      - topic: "Immigration"
        note: "Bankhead says she opposes current immigration policy and enforcement funding levels, calling to 'rein back' DHS/ICE funding to prior levels and restore prior training standards, while cutting the bureaucratic delays that make legal immigration take years; she maintains that unlawful entry should still 'be done legal and above board.'"
        coverage: 3
        position_tag: "Expand legal pathways"
        position_type: "pos"
        source: 0
      - topic: "Housing"
        note: "Bankhead proposes raising the capital gains exemption on home sales from $250,000 to $500,000 to increase housing inventory, offering tax breaks to construction companies whose portfolios are at least 30% affordable housing, and 'taking corporate entities out of housing' by restricting large-scale corporate and investor ownership."
        coverage: 3
        position_tag: "Increase government programs"
        position_type: "pos"
        source: 0
