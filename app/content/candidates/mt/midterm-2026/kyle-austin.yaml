  last_updated: "2026-08-22"
  callout: "Kyle Austin is a Billings pharmacist and small-business owner (Pharm406) who switched from the Republican to the Libertarian ballot for this race, saying he remains 'conservative and Republican in practice' and would caucus with both parties 'when necessary.' His signature proposal, 'Healthcare 2.0,' would consolidate Medicare, Medicaid, TRICARE, and VA coverage into a competitive government-run health plan modeled on the U.S. Postal Service, paired with national licensing reform to ease provider shortages; he says this preserves 'a sprinkling of socialism' rather than pursuing full Medicare for All or full privatization. His broader platform centers on cutting federal spending and regulation ('we need to DOGE the government'), farm-support measures like 0% USDA financing, and construction deregulation to address housing costs. Reviewed sources did not address his positions on criminal justice, reproductive policy, gun policy, LGBTQ+ policy, education, broadband/infrastructure, environmental or energy policy, or immigration."
