sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Austin says the cost of living is 'out of control... because our government has gotten so big,' and calls to 'DOGE the government' at the federal and state level to cut spending, lower taxes, and reduce costs; on housing specifically he calls for lower interest rates, fewer construction barriers, and zero tariffs on building supplies."
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: 0
      - topic: "Taxation"
        note: "Austin says Montana has 'overtaxed small businesses' and pledges to 'cut the fat, deregulate businesses and lower taxes for everyone,' consistent with his broader call to cut government spending so taxes can come down."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: 1
      - topic: "Small business & farming"
        note: "Austin's plan combines two distinct mechanisms: increased targeted government support for farmers and ranchers (overhauling and strengthening the USDA, keeping farmers out of trade wars, redirecting spending into 0% USDA financing, and assisting domestic fertilizer production) alongside deregulation for small business generally (citing his own pharmacy business, he argues licensure and reporting requirements to HHS and the Board of Pharmacy drive up costs and calls for cutting 'red tape')."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: 1
      - topic: "Workers & wages"
        note: "Austin argues extended licensing and degree requirements (e.g., pharmacy programs growing from four to six years) have caused workforce shortages and driven up costs, and proposes shorter degree paths and workplace-based credentialing (e.g., physician assistants building toward higher credentials on the job) instead of additional schooling."
        coverage: 2
        position_tag: "Reduce labor regulation"
        position_type: "pos"
        source: 2

