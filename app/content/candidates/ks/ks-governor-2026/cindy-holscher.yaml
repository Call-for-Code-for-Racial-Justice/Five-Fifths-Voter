sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Calls affordability her focus: 'it really boils down to affordability issues for working Kansans' [00:00:29]. Her campaign page says she will 'focus on keeping costs down on the basics' (housing, healthcare, childcare, groceries, gas) but lists no specific mechanism. Blames tariffs and war for rising costs (HPPR)."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Taxation"
        note: "Campaign page: lower residential assessment rates and add exemptions so seniors and disabled veterans are not pushed from their homes. KCUR: supports cutting the residential assessment rate by 2.5% rather than a hard cap. In the interview she says the Legislature's property tax bills are 'gimmicks and band-aids' and that Kansas 'can't keep doing these billionaire giveaways and tax exemptions for the rich and corporations' [00:03:14-00:04:08]. Wichita forum summary: wants to stop tax breaks for the wealthiest Kansans."
        coverage: 3
        position_tag: "Restructure tax system"
        position_type: "pos"
        source: [9, 4, 0]
      - topic: "Small business & farming"
        note: "Campaign agriculture page: lower fuel and fertilizer costs, protect access to fair markets, fully fund and carry out the Kansas Water Plan, safeguard the Ogallala Aquifer and rebuild reservoirs. No detailed budget or timeline given. At the Wichita forum she said large incentive packages leave little for small businesses (summary)."
        coverage: 2
        position_tag: "Increase government support"
        position_type: "pos"
        source: [11, 2]
      - topic: "Workers & wages"
        note: "Campaign page: fight to raise the statewide minimum wage to $16, with higher rates in high-cost areas, and ensure workers do not lose pay when sick. In the interview she contrasts the $7.25 Kansas minimum wage with $15+ in Missouri and calls raising the minimum wage a mainstream issue [00:05:47-00:06:00, 00:07:00-00:07:14]."
        coverage: 3
        position_tag: "Raise minimum wage"
        position_type: "pos"
        source: [8, 0, 2]

