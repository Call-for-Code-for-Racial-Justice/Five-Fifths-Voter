        source: [3, 1]
      - topic: "Voting & elections"
        note: "Democracy Now!: opposed the 2026 ballot measure to elect Kansas Supreme Court justices, saying it would 'make it into an election system, where Elon Musk or whoever else can come help buy these positions'. HPPR notes she did not state a position on specific voting policy such as ballot access or voter verification. No position on the taxonomy topic found."
        coverage: 1
