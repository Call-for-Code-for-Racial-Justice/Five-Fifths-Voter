  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Campaign healthcare page: expand Medicaid as governor (estimated to lower costs for 152,000 Kansans), protect rural hospitals, ban insurer denials of prescribed care and speed up insurance approvals. Interview: Medicaid expansion is a top priority and she helped pass it in 2017 [00:00:10, 00:01:00-00:01:22]. Wichita forum summary: says Kansas has forfeited more than $7 billion by not expanding."
        coverage: 3
        position_tag: "Expand public coverage"
        position_type: "pos"
        source: [10, 0, 2]
      - topic: "Education"
        note: "Interview: 'fully funding education, general ed has been adequately funded, but special ed has not since 2011' [00:00:15-00:00:25]; the state must 'fulfill our obligation on funding education' [00:04:03]. Campaign site lists fully funding public schools and says she helped secure $500 million in new school funding. HPPR: backs fully funding K-12 special education."
        coverage: 3
        position_tag: "Increase public school funding"
        position_type: "pos"
        source: [0, 6, 3]
