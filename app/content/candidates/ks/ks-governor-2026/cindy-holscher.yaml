  callout: "Cindy Holscher is the Democratic state senator for Kansas Senate District 8 (Overland Park), served in the Kansas House from 2017 to 2020, and is the Democratic nominee for governor. Her campaign centers on affordability, fully funding public schools including special education, property tax relief, Medicaid expansion, and curbs on corporate tax breaks. Her platform also includes legalizing cannabis, a moratorium on new data centers until guardrails are in place, and a $16 minimum wage."
