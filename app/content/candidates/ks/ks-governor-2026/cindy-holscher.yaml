        note: "Supports a moratorium on new data centers until guardrails on water and electricity use are in place [00:08:31-00:08:46]; Democracy Now!: data centers 'suck up the resources in terms of water'. Wichita forum summary: calls oil and gas a lasting part of the Kansas economy that needs to be safeguarded from rising electricity costs. No overall position on regulation versus production found in reviewed sources."
