      - topic: "Reproductive policy"
        note: "HPPR/Kansas Reflector: supports abortion rights, opposed the 2022 constitutional amendment, and warned that 'reproductive healthcare in Kansas will be eliminated' if her opponent is elected. In Democracy Now! she describes the 2022 vote as being about 'access to reproductive healthcare'. The campaign issues overview does not list the topic."
        coverage: 2
