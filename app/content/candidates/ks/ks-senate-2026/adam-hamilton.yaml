sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "The campaign's Affordability Agenda focuses on competition and consumer protection: ending tariffs and requiring congressional approval for new ones, binding rules so data centers pay their own electricity costs, competitive bidding for transmission projects, banning algorithmic price-fixing at grocery stores, banning junk fees, restoring overdraft fee protections, and investigating private equity consolidation. Says people are \"living paycheck to paycheck, struggling harder now\" (Johnson County Post)."
        coverage: 3
        position_tag: "Centrist or alternative approach"
        position_type: "pos"
        source: [6, 1]
      - topic: "Taxation"
        note: "Calls tariffs a hidden tax (Johnson County Post, campaign Issues page) and proposes targeted tax credits for first-time home buyers, firefighters, police officers and teachers, plus restoring energy production tax credits. No position on income, corporate or overall tax levels found in reviewed sources."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Small business & farming"
        note: "The campaign Issues page proposes doubling funding for USDA export promotion programs, fully funding the animal disease vaccine bank and preparedness programs, passing the Rural Veterinary Workforce Act, passing a full five-year farm bill, expanding USDA's Fertilizer Production Expansion Program, and year-round E15. At the State Fair debate he proposed making the H-2A agricultural visa program year-round."
        coverage: 3
        position_tag: "Increase government support"
        position_type: "pos"
        source: [6, 0]
      - topic: "Workers & wages"
        note: "The campaign Issues page supports strengthening the right to organize, starting with the bipartisan Faster Labor Contracts Act; fully funding the NLRB, OSHA and NIOSH; harsher penalties and stronger Department of Labor enforcement against wage theft; and the No Robot Bosses Act requiring human review of AI hiring and firing decisions. No minimum wage position found."
        coverage: 3
        position_tag: "Expand worker protections"
        position_type: "pos"
        source: [6]

  - id: "civil-rights-justice"
    title: "Civil rights & justice"
    items:
      - topic: "Criminal justice system"
        note: "Only narrow references: the campaign Issues page proposes strengthening the Department of Justice's Elder Justice Initiative against elder fraud and limiting presidential pardon power. No position on incarceration, policing or prevention found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Reproductive policy"
        note: "Says \"I don't believe that the Kansas Legislature should be making that decision for women in our state. Neither should the United States Senate or House\" (Johnson County Post), while acknowledging moral tension. AP reports he voted against the 2022 Kansas abortion amendment. The campaign Issues page pledges to protect a woman's right to choose, codify access to contraception, and require insurers to cover over-the-counter birth control."
        coverage: 3
        position_tag: "Pro-choice"
        position_type: "pos"
        source: [1, 3, 5, 6]
      - topic: "Voting & elections"
        note: "The campaign Issues page proposes ending dark money in elections, term and age limits for Congress, and stronger congressional residency requirements. No position on ballot access or voter verification found in reviewed sources."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Gun policy"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "LGBTQ+ policy"
        note: "PBS NewsHour reports he supports same-sex marriage and the ordination of LGBTQ+ clergy. When Marshall called him \"too woke,\" he said he is \"caring, compassionate and concerned for people, especially vulnerable people\" (Johnson County Post). No federal legislative position found in reviewed sources."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null

  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "The campaign Issues page proposes reversing federal Medicaid cuts, restoring enhanced ACA subsidies, expanding Medicare to cover vision and dental, expanding Medicare drug price negotiation and extending negotiated prices to private plans, investing in rural hospitals, reforming prior authorization, and capping interest on medical debt. In The Contrarian interview he says people need \"a basic level of access to healthcare, no matter what.\""
        coverage: 3
        position_tag: "Expand public coverage"
        position_type: "pos"
        source: [6, 1, 2]
      - topic: "Education"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Broadband & infrastructure"
        note: "Only a narrow reference: the campaign Issues page calls for competitive bidding on electric transmission projects. No broadband or broader infrastructure position found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "The campaign Issues page calls for an \"all of the above\" energy strategy to increase energy independence, restoring repealed energy production tax credits, ending opposition to domestic energy projects, and year-round E15 ethanol. Ties fuel costs to the war in Iran (Johnson County Post, The Contrarian). No environmental regulation or climate position found in reviewed sources."
        coverage: 3
        position_tag: "Prioritize energy production"
        position_type: "pos"
        source: [6, 1, 2]
      - topic: "Immigration"
        note: "The campaign Issues page proposes reforming the H-2A program with year-round visas, lower compliance costs, and a path to legal status for existing agricultural workers; he also proposed year-round H-2A visas at the State Fair debate. In The Contrarian interview he supports \"safe and secure borders\" but says militarized ICE operations are \"not okay.\" No specific enforcement mechanism found."
        coverage: 3
        position_tag: "Expand legal pathways"
        position_type: "pos"
        source: [6, 0, 2]
      - topic: "Housing"
        note: "The campaign Issues page combines reducing building barriers (ending tariffs on building materials, modernizing modular home regulations) with government intervention (banning investors from buying single-family homes, new tax credits for first-time buyers and public servants, and stopping algorithmic rent price collusion)."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [6]
