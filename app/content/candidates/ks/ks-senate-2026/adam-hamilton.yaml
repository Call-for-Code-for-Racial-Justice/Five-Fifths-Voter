  callout: "Adam Hamilton is the Democratic nominee for U.S. Senate in Kansas and the founding pastor of Church of the Resurrection, the nation's largest United Methodist church. A first-time candidate who describes himself as a centrist, his platform centers on affordability (energy, health care, housing and food costs), opposition to tariffs and the war in Iran, support for Kansas agriculture, and stronger labor protections. He also proposes congressional ethics reforms including a ban on stock and crypto trading by members, term and age limits for Congress and the Supreme Court, a lifetime lobbying ban, and limits on presidential pardon power."
