  - id: "civil-rights-justice"
    title: "Civil rights & justice"
    items:
      - topic: "Criminal justice system"
        note: "Says she is 'all about supporting law and order and law enforcement' (FOX 35, [00:03:57]). Describes human trafficking strike teams, anonymous tip lines, and going after organized and violent crime (Spectrum News, [00:06:50]-[00:12:00]). OnTheIssues lists her support for stronger penalties under the Thin Blue Line Act. Campaign About page: 'crack down on violent crime.'"
        coverage: 3
        position_tag: "Increase enforcement"
        position_type: "pos"
        source: [0, 1, 3, 5]
      - topic: "Reproductive policy"
        note: "Campaign About page calls her 'a national leader in protecting religious freedom and the sanctity of life.' OnTheIssues records that she cosponsored the Born-Alive Abortion Survivors Protection Act (Oct 2025) and, as Attorney General, fought to keep an abortion access question off the state ballot. She said she is a proponent of 'protecting life' (FOX 35, [00:05:05]). No specific exceptions were stated in reviewed sources."
        coverage: 2
        position_tag: "Pro-life"
        position_type: "pos"
        source: [1, 3, 5]
      - topic: "Voting & elections"
        note: "OnTheIssues notes she supported a legal brief allowing voter roll purges (Oct 2024) and joined a lawsuit challenging 2020 election results. No stated position on ballot access or voter verification in the interviews or campaign site. No position found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Gun policy"
        note: "OnTheIssues records that she cosponsored the Constitutional Concealed Carry Reciprocity Act (Oct 2025). Not discussed in the interviews or on the campaign site."
        coverage: 2
        position_tag: "Expand gun rights"
        position_type: "pos"
        source: [3]
      - topic: "LGBTQ+ policy"
        note: "OnTheIssues records a 2023 comment comparing a children's book depicting gay penguins to propaganda, and support for religious exemptions for campus groups (Mar 2026). No stated position on legislation or protections. No position found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

