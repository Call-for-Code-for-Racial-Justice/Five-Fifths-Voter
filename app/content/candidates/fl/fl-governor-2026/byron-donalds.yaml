  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "CBS Miami interview: will finish Central Everglades restoration 'once and for all'; backs small modular nuclear reactors and says 'Solar plants and wind farms do not address baseload power'; wants data centers to generate their own power on site. WUSF interview: 'if you don't have fresh water, you have nothing'; opposes developing conservation-area state parks; opposes data center moratoriums and bans but supports keeping the state data center law."
        coverage: 3
        position_tag: "Balance both"
        position_type: "pos"
        source: [1, 2]
      - topic: "Immigration"
        note: "Fox 35 interview [00:09:46]-[00:10:44]: Florida will continue cooperating with the Trump administration to remove 'criminal illegal aliens'; [00:13:22]-[00:13:30] opposes sanctuary jurisdictions. Campaign Law and Order page: require E-Verify for all Florida businesses and cut state funds that encourage illegal immigration. Face the Nation: wants 'legal immigration with assimilation.' ABC News 4: supports ending the current interpretation of birthright citizenship."
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: [0, 3, 4, 9]
      - topic: "Housing"
        note: "Fox 35 interview [00:05:46]-[00:06:24]: wants to be 'efficient with people's time' and not have builders 'bogged down in red tape'; 'If you can build housing more quickly, it actually decreases the cost of housing.' ABC News 4: says permitting costs drive up home prices. Also supports regional growth planning [00:06:33]-[00:07:03]."
        coverage: 3
        position_tag: "Reduce development barriers"
        position_type: "pos"
        source: [0, 4]
