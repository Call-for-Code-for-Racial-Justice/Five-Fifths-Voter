  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Fox 35 interview [00:19:42]-[00:21:48]: 'we're not going to expand Medicaid in our state'; wants the Affordable Care Act reformed so people 'have more options to get lower-cost policies'; opposes subsidies to insurers. Campaign Healthcare page ('Your Doctor, Your Price'): posted cash prices for the 50 most common procedures, best-price guarantee, three-day insurer approvals."
        coverage: 3
