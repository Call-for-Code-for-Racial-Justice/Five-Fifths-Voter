  callout: "Donalds is a Republican congressman who previously served in the Florida House and is running for governor with an endorsement from President Trump. His platform centers on property insurance and homestead property tax relief, permitting reform, health care price transparency, school choice and workforce pathways, and cooperation with federal immigration enforcement. Other notable positions outside the scorecard taxonomy include opposing Medicaid expansion, loosening state vaccine mandates toward informed consent, and supporting small modular nuclear reactors and on-site power for data centers."
