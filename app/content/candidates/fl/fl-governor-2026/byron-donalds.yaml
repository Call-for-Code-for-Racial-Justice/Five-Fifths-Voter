sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Fox 35 interview [00:04:59]-[00:06:24]: names homestead property tax elimination, insurance tort reform and re-examining insurance regulation to bring in new carriers and competition, and faster housing permitting. Campaign Affordability page adds an online insurer scorecard, a smaller Citizens Insurance, and keeping data centers from shifting utility costs to households."
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: [0, 5]
      - topic: "Taxation"
        note: "Fox 35 interview [00:05:00]-[00:05:13]: fully supports the governor's plan to eliminate homestead property taxes. CBS Miami interview: 'we need to repeal Homestead property taxes.' Campaign Economy page: keep personal income tax at zero, balance the budget annually, and cut taxes whenever possible."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 1, 7]
      - topic: "Small business & farming"
        note: "Campaign Economy page: 'Bureaucratic delays shouldn't stop honest people from opening a business.' Proposes a public permit shot clock, a single digital hub for major development permits, and specialized business courts. No farming-specific proposals found in reviewed sources."
        coverage: 3
        position_tag: "Reduce regulation"
        position_type: "pos"
        source: [7]
      - topic: "Workers & wages"
        note: "Only a passing reference: the Law and Order page says E-Verify would let legal workers 'keep the jobs and wages they've earned.' No position on minimum wage or worker protections found in reviewed sources."
