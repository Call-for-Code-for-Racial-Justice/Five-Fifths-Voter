        position_type: "pos"
        source: [0, 6]
      - topic: "Education"
        note: "Fox 35 interview [00:15:05]-[00:15:43]: 'the money follows the child' whether to public, private, charter or homeschool. CBS Miami interview: 'a school choice champion and advocate my entire time in politics.' Campaign Education page: Read to Succeed literacy plan, LaunchPad Florida apprenticeships, and letting education money follow the student."
        coverage: 3
