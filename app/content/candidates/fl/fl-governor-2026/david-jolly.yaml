  callout: "Jolly represented Florida's 13th District as a Republican from 2014 to 2017, left the party, and is now the Democratic nominee for governor with Gwen Graham as his running mate. His platform centers on housing, health care, public education and a state catastrophic fund to cut homeowners insurance. Other notable positions outside the scorecard taxonomy include a day-one moratorium on hyperscale data centers, campaign finance and ethics reform, home rule and an office of civil rights."
