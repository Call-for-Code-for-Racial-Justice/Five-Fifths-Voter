  callout: "James Talarico is a Texas state representative from the Austin area, a former middle school teacher and a Presbyterian seminarian. His campaign centers on taking on corruption and billionaire influence, with a platform of higher taxes on corporations and the wealthy, a $15 federal minimum wage, a public health insurance option, and codifying Roe v. Wade. His site also lists positions outside the scorecard topics, including legalizing regulated adult marijuana use and policies on social media, AI and foreign policy."
