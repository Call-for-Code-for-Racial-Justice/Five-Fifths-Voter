  callout: "Ken Paxton is the Texas Attorney General, a former Texas House and Senate member, and the Republican nominee after defeating Sen. John Cornyn in the May 2026 primary runoff. His campaign emphasizes the Protecting the Texas Promise tax plan (medical, home down payment and healthy-living deductions, a doubled child tax credit and permanent Trump Accounts), border security and deportations, and support for President Trump's agenda. His site also lists positions outside the scorecard topics, including making America the crypto capital of the world, an America First foreign policy and action against Big Tech."
