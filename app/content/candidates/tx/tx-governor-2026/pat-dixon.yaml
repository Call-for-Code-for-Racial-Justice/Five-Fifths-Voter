  callout: "Pat Dixon is the Libertarian nominee for governor, a professional engineer, former two-term Lago Vista city councilmember and former Libertarian Party of Texas chair. His platform centers on what he calls free market sustainability, meaning growth should pay for its own costs rather than rely on taxpayer-funded incentives, along with lower taxes tied to lower spending, school choice and limits on eminent domain. Notable positions outside the taxonomy include ending the war on drugs, supporting hemp and THC access for adults, opposing the death penalty, seeking a pardon review for Robert Roberson, opposing the 765 kV transmission buildout's use of eminent domain, and a proposed digital bill of rights limiting Flock-style surveillance cameras."
