        source: null

  - id: "civil-rights-justice"
    title: "Civil rights & justice"
    items:
      - topic: "Criminal justice system"
        note: "Death Penalty page: 'I oppose the death penalty because government should not have the power to make an irreversible mistake'; would support repeal. Says he would seek exoneration of Robert Roberson. Interview [00:30:47]: supports ending the war on drugs and modeling drug policy on alcohol. Interview [00:17:27]: 'I am not soft on crime' and supports police; wants warrants for surveillance data. No single stated position on incarceration or enforcement overall."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Reproductive policy"
        note: "Abortion page: personally pro-life and Catholic but will not use office to impose his religious beliefs; does not want politicians in medical decisions; unsure of the best policy on rape and incest. Interview [00:26:09]: would encourage the legislature to revisit clarity so doctors are not afraid to act. No statement of what restrictions or exceptions he would support."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Voting & elections"
        note: "Election Integrity page: wants assurance that registered voters meet residency and legal status requirements, suggests photos or biometrics on voter registration cards, is skeptical of strict ID requirements, and says Texas election results are legitimate. Approval Voting page: 'I would support the ability for cities to use better voting systems,' favoring approval voting and also ranked choice."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [7, 8]
      - topic: "Gun policy"
        note: "Guns page: affirms 'a constitutional right to keep and bear arms,' says he would defer to the Legislature, wants clear command structures and active-shooter training, wants due process in any red flag law and opposes broad mental health screening of gun owners. He does not state a position on specific bills or on changing current laws."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "LGBTQ+ policy"
        note: "Biblical Principles questionnaire: said the governor has no role in a marriage definition and 'I also do not object to homosexual couples adopting or caring for a child.' Single passing reference; no stated position on protections or limits."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

