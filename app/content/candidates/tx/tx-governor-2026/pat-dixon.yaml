        note: "Interview [00:19:32]: 'That's why I support school choice.' [00:20:36] supports and wants to expand the voucher program while fixing problems. School Choice page: 'I support parents being empowered to choose what is best for their kids,' ideal of a statewide scholarship so equal funding follows every child, and removing state mandated tests."
