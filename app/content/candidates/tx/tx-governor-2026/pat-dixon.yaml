sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Community Impact: taxes and costs are high because residents are paying for growth; 'Growth needs to pay for itself.' Campaign page: 'Free market sustainability means growth pays for itself,' with developers and large users covering their own impact. Interview [00:12:42]-[00:14:04]: 'taxpayers should not pay for growth.'"
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: [0, 2, 12]
      - topic: "Taxation"
        note: "Interview [00:10:03]: 'I'm in favor of lower taxes as long as it's lower spending.' Property tax page: would start by identifying spending cuts, opposes replacing property tax with sales tax, supports simpler appraisal. How to Return Taxes page: would lower the state retail tax. Criticizes Abbott's property tax plan as unworkable for a governor."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 1, 6, 7]
      - topic: "Small business & farming"
        note: "No position found in reviewed sources. Interview [00:11:18] mentions cutting Department of Agriculture barbecue scale inspections as wasteful spending, but this is not a stated small business or farming policy."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Workers & wages"
        note: "No position found in reviewed sources."
        coverage: 0
