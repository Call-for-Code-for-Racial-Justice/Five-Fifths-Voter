        note: "Interview [00:14:52]: concern about 765 kV transmission lines is eminent domain abuse; says growth will bring energy demand and transmission lines. Opposes tax incentives for AI data centers that strain water and power, while accepting projects that pay for their impact. No stated position on environmental regulation versus energy production."
