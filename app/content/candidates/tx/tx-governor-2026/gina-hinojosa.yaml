  callout: "Gina Hinojosa is a state representative from Austin, a former civil rights and union lawyer and Austin ISD school board member, and won the Democratic nomination in March 2026. Her campaign centers on public schools, opposition to school vouchers, $1,500 household refund checks and other cost relief, and what she calls Abbott's corruption tax. Abbott's campaign declined debate invitations, so no debate has occurred. Outside the taxonomy, she calls for a ban on surveillance pricing of groceries and a state AI policy."
