sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Campaign: one-time $1,500 refund checks to every Texas household from the Rainy Day Fund surplus, a ban on surveillance pricing of groceries, and a Public Utility Commission freeze on residential electric rates until data centers and other high-load users pay their own infrastructure costs. PBS interview: says electric bills are 'eating up more and more of our income as Texas families' and proposes cash-back for renters. Apr. 27 CBS Austin: asked Abbott to waive the state gas tax."
        coverage: 3
        position_tag: "Government programs"
        position_type: "pos"
        source: [0, 2, 4, 7]
      - topic: "Taxation"
        note: "Campaign: end corporate subsidies and use the savings to cut property taxes, with a long-term goal of eliminating residential property taxes; repeal data center tax incentives; $1,500 household refunds from the Rainy Day Fund. PBS interview: 'renters pay property taxes too, but never get the benefit of the property tax cuts', wants to 'cut the sales tax for our small business owners instead.' Apr. 21 CBS Austin: says schools should be funded by prioritizing existing money rather than raising taxes."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 1, 4, 7]
      - topic: "Small business & farming"
        note: "PBS interview: notes Texas small businesses 'make less in profits than the national average' and proposes a sales tax cut for them. Questionnaire lists tax cuts for small businesses and expanded job and technical training. Not addressed on the campaign website. Farming not addressed."
        coverage: 2
        position_tag: "Increase government support"
        position_type: "pos"
        source: [0, 4]
      - topic: "Workers & wages"
        note: "Questionnaire: 'Texans are working more but getting less' and proposes expanded job and technical training. Campaign website pledges to make teachers among the highest paid in the nation (scored under Education). No position on minimum wage, worker protections or labor regulation found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

