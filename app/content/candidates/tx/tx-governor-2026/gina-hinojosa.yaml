  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Campaign: ban bad-faith insurance denials and strengthen rural hospitals. PBS interview: says 'Texans are the most uninsured of any people in the nation' but offers no specific policy. Questionnaire: lower health care costs through action against insurers and drug companies. Texas Tribune: says Republicans are 'cheating Texans out of basic health care.' No coverage expansion or private-options position stated, so no tag applied."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Education"
        note: "Campaign: end the voucher program and direct the money to neighborhood schools; end STAAR and similar high-stakes tests and pause A-F ratings; return state-taken-over districts to local control; replace the TEA commissioner on day one; end vendor contracts she calls corrupt and use the savings to make teachers among the highest paid in the nation. PBS interview: 'I believe we can undo vouchers.' Oct. 15 SA Current: wants to increase state spending on public education."
        coverage: 3
        position_tag: "Increase public school funding"
        position_type: "pos"
        source: [0, 1, 2, 3, 7]
      - topic: "Broadband & infrastructure"
        note: "Questionnaire: would 'invest in the infrastructure we need' and cut wasteful vendor contracts, with emphasis on the power grid and border ports of entry. Campaign website calls for notice-and-comment processes on new transmission lines. Broadband not addressed."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Campaign: an immediate executive-order moratorium on new data centers, a special session to repeal data center tax incentives, binding laws giving communities a say in data center siting, and a residential rate freeze until high-load users pay their own infrastructure costs. PBS interview: on data centers, 'When I'm governor, they will pay for themselves.' Questionnaire: enforceable reliability standards for utilities. Apr. 27 CBS Austin: guarantee household water before industry."
        coverage: 3
        position_tag: "Prioritize regulation"
        position_type: "pos"
        source: [0, 2, 3, 4, 7]
      - topic: "Immigration"
        note: "PBS interview: 'we should not be having this indiscriminate targeting of our American families and our communities,' calls for a humane approach while insisting on border security. Apr. 21 CBS Austin: calls Abbott's threat to withhold grants from cities 'unacceptable.' Apr. 27 CBS Austin: opposes taxpayer money for private detention centers. Questionnaire: ports of entry infrastructure, local law enforcement support and coordination with federal partners. Not addressed on the campaign website."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [0, 1, 2, 4]
      - topic: "Housing"
        note: "Campaign: stop private equity and institutional investors from buying up homes, citing her 2025 bill to limit institutional investors to 10 single-family homes. PBS interview: 'Home ownership should be for the people of Texas,' proposes cash-back for renters."
        coverage: 3
        position_tag: "Increase government programs"
        position_type: "pos"
        source: [0, 7]
