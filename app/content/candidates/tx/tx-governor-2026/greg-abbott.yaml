        note: "Accomplishments page says he 'created the first universal school choice program in Texas' with $1 billion for Education Freedom Accounts. Policy page also proposes Student Success Academies in public schools, 70% of funding dedicated to the classroom, school district audits, and limits on classroom screen time."
        coverage: 3
