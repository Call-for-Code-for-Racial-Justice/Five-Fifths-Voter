  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Accomplishments page says Texas produces 25% of domestically produced US energy and cites a $10 billion Texas Energy Fund. He also paused new data center approvals; ABC interview: 'I have pressed pause on any new data center being able to join the operations in the state of Texas,' requiring them to disclose water use, supply their own power and lower electricity costs."
        coverage: 3
        position_tag: "Balance both"
        position_type: "pos"
        source: [5, 0, 2]
      - topic: "Immigration"
        note: "Accomplishments page says he launched Operation Lone Star in March 2021, with over $11.1 billion spent on border security, and claims it reduced illegal crossings into Texas by 85% during the Biden Administration. Policy page would deny bail to illegal immigrants arrested for violent felonies."
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: [5, 4]
      - topic: "Housing"
        note: "Campaign policy page would allow third-party inspections, require an occupancy determination within 10 days, pre-approve home designs once at least three cities approve them, allow property additions by right, and withhold local sales tax from cities that undermine state housing reforms."
        coverage: 3
        position_tag: "Reduce development barriers"
        position_type: "pos"
        source: [4]
