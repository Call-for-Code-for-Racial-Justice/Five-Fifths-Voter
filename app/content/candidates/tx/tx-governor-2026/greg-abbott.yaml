sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Campaign policy page pairs a market mechanism, opening city-run electric monopolies to retail competition, with a state program, a $400 million roof fortification program offering up to $10,000 per homeowner. Also lets auto insurers consider good driving habits. In the ABC interview he promised 'lowering housing costs, lowering health care costs, lowering auto insurance costs.'"
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [4, 0]
      - topic: "Taxation"
        note: "Proposes cutting property taxes in half; would let voters end school district property taxes on homesteads, cap homestead appraisal increases at 3%, and require two-thirds voter approval for local tax increases. KBTX: 'It starts with slashing property taxes in half.' ABC: his platform would cut taxes."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [4, 1, 0]
      - topic: "Small business & farming"
        note: "Campaign accomplishments page cites a Small Business Freedom Council and efforts to cut regulations, and describes Texas as a leading state for small business job growth. No farming-specific position found."
        coverage: 2
        position_tag: "Reduce regulation"
        position_type: "pos"
        source: [5]
      - topic: "Workers & wages"
        note: "Campaign page cites $850 million for career workforce training and faster occupational licensing for military members and veterans; KCBD interview covers workforce pathways and the Texas Jobs Council. No position found on minimum wage, worker protections or labor regulation."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

