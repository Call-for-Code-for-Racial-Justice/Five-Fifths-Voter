    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Campaign policy page would cap monthly co-pays at $25 for inhalers and epinephrine and authorize a more affordable 'Essential Benefits Health Insurance Plan' for employers, with premiums that 'could fall by nearly 20%.'"
        coverage: 2
