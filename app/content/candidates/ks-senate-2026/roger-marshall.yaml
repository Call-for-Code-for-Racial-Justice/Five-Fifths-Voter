  callout: "Roger Marshall is the Republican incumbent U.S. Senator from Kansas, a former OB-GYN from Great Bend who served in the U.S. House from 2017 to 2021 and has been in the Senate since January 2021. His platform emphasizes rural health care funding and price transparency, farm and ethanol policy, all-of-the-above energy, border enforcement, and voter ID through the SAVE America Act. He supports President Trump's agenda, including the 2025 tax and Medicaid law and tariffs. Not covered in the reviewed sources: gun policy, abortion, LGBTQ+ policy, and education."
