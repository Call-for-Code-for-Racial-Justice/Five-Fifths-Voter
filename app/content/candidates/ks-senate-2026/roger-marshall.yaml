sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Meet the Press: 'I understand the cost of living is the defining issue right now' [00:04:16]; goal of lowering gas and grocery costs [00:01:27]. Campaign page cites S. 4418 to remove Morocco phosphate duties (claimed 20%+ fertilizer cost cut), year-round E15, voiding the EPA methane-fee rule, and votes against stopgap spending bills."
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: [1, 4]
      - topic: "Taxation"
        note: "Campaign page says he voted yes on the Working Families Tax Cuts making the 2017 tax cuts permanent (small business deduction, full expensing, R&D expensing, expanded child tax credit). In the rural hospital interview he describes the law as 'the largest tax cut in history' and cites a doubled estate tax exemption, the 199A pass-through deduction, and bonus depreciation [00:03:04, 00:10:16]."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [3, 4]
      - topic: "Small business & farming"
        note: "Support side: campaign page backs Title I and crop insurance funding as 'the safety net Kansas growers cannot operate without' and the 45Z clean fuel credit; rural hospital interview credits crop insurance and reference prices in the 2025 law [00:09:51]. Regulation side: backs the DIRECT Act (S. 3099) to allow interstate sale of state-inspected beef, and lists 'rolling back regulations' as a priority [00:14:44]."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [3, 8]
      - topic: "Workers & wages"
        note: "Only a passing reference: on Meet the Press he said real wages are up since Trump took office and called the current dip a 'blip' [00:04:00]. The host disputed this on air. No wage, minimum wage, or labor policy position found in reviewed sources. Medicaid work requirements are covered under Healthcare."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

