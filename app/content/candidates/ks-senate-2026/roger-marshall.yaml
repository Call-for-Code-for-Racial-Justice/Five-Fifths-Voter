  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Rural hospital interview: says he 'came here to fix the cost of healthcare' through more price transparency and more health savings accounts to 'turn patients back into good consumers' [00:15:01-00:15:09]. Campaign page lists his Patients Deserve Price Tags Act (S. 2355) and Medicare Advantage prior-authorization deadlines (S. 1816). Supports work requirements of 20 hours a week for healthy Medicaid adults and a $50 billion rural health fund administered through CMS [00:08:54, 00:06:58]."
        coverage: 3
        position_tag: "Expand private options"
        position_type: "pos"
        source: [3, 5]
      - topic: "Education"
        note: "No position found in reviewed sources. Campaign page mentions the Whole Milk for Healthy Kids Act (school lunch), which is a nutrition measure."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Broadband & infrastructure"
        note: "Brief passing reference: said long-term rural hospital survival depends on rural economies having 'high-speed internet' and healthy water [00:07:22]. No specific broadband or infrastructure position found."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Campaign page: 'All-of-the-above is the Kansas energy answer.' Cosponsored the resolution voiding the EPA methane-fee rule, cosponsors the Natural Gas Tax Repeal Act (S. 143), voted for a permitting-reform package, and backs year-round E15 and the 45Z credit."
        coverage: 3
        position_tag: "Prioritize energy production"
        position_type: "pos"
        source: [7]
      - topic: "Immigration"
        note: "Enforcement side: 'no amnesty. Full stop,' prioritizing violent offenders, doubling ICE removal agents, 2,000 miles of border barrier [00:11:55-00:13:44]; campaign page lists the Laken Riley Act, Build the Wall Act, and 287(g) expansion. Pathway side: described a 2018 proposal under which employed workers vouched for by an employer who pass a background check could be processed to re-enter legally, and campaign page cites H-2A agricultural labor reform [00:12:59-00:13:20]."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [3, 6]
      - topic: "Housing"
        note: "Called housing a 'top three issue' in Kansas and favors community-led solutions with 'loose guardrails,' citing Salina's grant work as a model [00:08:10-00:09:28]. Took credit for a housing law signed after being a major part of it [00:11:00]. On Meet the Press he said holding the bipartisan housing bill was 'classic Donald Trump negotiation style' [00:03:30]. No specific housing policy tag fits."
        coverage: 2
        position_tag: null
