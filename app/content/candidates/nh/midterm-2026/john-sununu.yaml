  callout: "John E. Sununu is a former three-term U.S. Representative and one-term U.S. Senator from New Hampshire and the Republican nominee, returning to politics after nearly two decades in business, teaching, and nonprofit board service. His campaign centers on affordability, with a focus on housing, health care, and energy costs, lower taxes, and being an effective voice for New Hampshire. Positions outside the scoring taxonomy include support for Congress reclaiming tariff and spending powers from the executive branch, opposition to U.S. ground troops in Iran while backing goals of preventing an Iranian nuclear weapon and reopening the Strait of Hormuz, and a record on surveillance and civil liberties reform."
