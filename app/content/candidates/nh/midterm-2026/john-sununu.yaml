  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Debate: wants more domestic oil and gas production, permitting reform for electric transmission and gas pipelines, and an end to mandates that force utilities to buy at above-market rates. Dartmouth: calls for more production, transmission infrastructure, and pipeline capacity. No environmental regulation position found."
        coverage: 3
        position_tag: "Prioritize energy production"
        position_type: "pos"
        source: [0, 2]
      - topic: "Immigration"
        note: "Debate: favors ending birthright citizenship, through the courts or Congress if needed, and lists keeping the border secure as a campaign goal. NHPR and Debate: supports barring Medicaid for people in the country illegally. No legal pathway proposals found."
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: [0, 1]
      - topic: "Housing"
        note: "Debate and Dartmouth: wants to end tariffs on building materials, cut federal regulations on multifamily and workforce housing, and pursue permitting reform. NHPR: wants fewer federal requirements on HOME, Low-Income Housing Tax Credit, and Community Development Block Grant funds so they work better for local developers."
