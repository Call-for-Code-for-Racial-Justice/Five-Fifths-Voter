sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Debate: proposes health care competition and health savings accounts, ending tariffs on building materials, cutting federal housing regulations, and more energy production and permitting reform. NHPR and Dartmouth: names housing, health care, and energy as his three focus areas and says wages must outpace inflation after price increases under the Biden administration. About: says he will focus on reducing inflation and lowering housing, health care, and energy costs."
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: [0, 1, 2, 3]
      - topic: "Taxation"
        note: "Debate: says he would have voted for the Big Beautiful Bill, describes it as keeping taxes low with no tax on overtime, tips, and a Social Security deduction, and calls a vote against it a vote for a tax increase. About: opposes all middle-class tax hikes and wrote the law banning internet access taxes. NHPR: cites a past balanced budget agreement that cut taxes and spending."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 1, 3]
      - topic: "Small business & farming"
        note: "Debate: says he ran a manufacturing operation and wants to avoid saddling New Hampshire small businesses with new taxes and regulations, and to scale back federal regulations. Farming not addressed."
        coverage: 2
        position_tag: "Reduce regulation"
        position_type: "pos"
        source: [0]
      - topic: "Workers & wages"
        note: "NHPR and Debate: says wages should grow faster than inflation and that job growth matters, especially for younger workers, but proposes no labor or wage policy. No position on minimum wage or labor regulation found."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

