  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "In the interview she backed legislation requiring private insurers such as Anthem to cover children's mental health treatment, calling the assessment on plans 'an insurance coverage issue' and 'not a tax' [00:04:31-00:06:07]. Campaign site cites funded mental health and substance use treatment, protected Medicaid, and a large federal health care award. These do not map clearly to one tag, so no tag is applied."
        coverage: 3
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Education"
        note: "Her budget opened education freedom accounts to any public school student by removing the income cap, and she supports continuing their expansion (Granite Post; NHPR State of the State). Campaign site also cites increased per-student funding, special education support, and a classroom cell phone ban. Reported as killing a school open-enrollment bill (June 2026)."
        coverage: 3
        position_tag: "Both public and choice"
        position_type: "pos"
        source: [2, 3, 5]
      - topic: "Broadband & infrastructure"
        note: "In the interview she discussed road projects such as Exit 6 on I-293, saying 'we will push hard to get those done' [00:07:22-00:07:41]. No position found in reviewed sources on broadband or on how infrastructure is funded beyond opposing higher out-of-state tolls."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Supports new nuclear power and directed her energy department to 'build pathways to foster the next generation of nuclear power' (NHPR); signed HB 672 creating off-grid electricity providers (Granite Post). Also backed local say over landfill siting, saying 'I'm always going to be focused on protecting our environment' [00:09:47-00:09:59], and plans to ask for a multiyear data center moratorium (Granite Post, Sept. 2, 2026)."
        coverage: 3
        position_tag: "Balance both"
        position_type: "pos"
        source: [0, 2, 3]
      - topic: "Immigration"
        note: "Granite Post: 'I support and encourage New Hampshire law enforcement agencies to cooperate with ICE'; signed a ban on sanctuary policies and backed the State Police 287(g) agreement with ICE. Campaign site says she got a planned DHS facility in Merrimack canceled after local objections."
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: [2, 5]
      - topic: "Housing"
        note: "NHPR: signed laws loosening zoning, including apartments and condos in some commercial zones and accessory dwelling units, and a budget requiring state departments to process housing permits within 60 days. She calls for more work on housing implementation and local partnership [Close Up, 00:00:20-00:00:54]. NHPR notes the Housing Champions program got no state funding in the budget; she told WMUR she wants to revisit it."
        coverage: 3
        position_tag: "Reduce development barriers"
        position_type: "pos"
        source: [1, 3, 4]
