    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "In the Close Up interview she cited replacing the PUC chairman to focus on affordability, pushing ISO New England on transmission costs, expanding energy including new nuclear, holding the line on taxes, expanding housing, and a child care tax credit [00:00:57-00:01:47]. These are several separate levers that do not map to one tag, so no single position tag is applied."
        coverage: 2
