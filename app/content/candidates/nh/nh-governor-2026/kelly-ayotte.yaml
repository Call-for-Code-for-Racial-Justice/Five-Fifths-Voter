        source: null
      - topic: "Taxation"
        note: "Campaign site: 'no income tax, no sales tax, EVER!' and a balanced budget with no new taxes. In the interview she said 'we have the lowest taxes in the region' and 'we're not going to pass on more costs to people' [00:01:22-00:01:29], and rejected higher out-of-state tolls [00:06:28-00:06:49]. Opposes new taxes but no source describes cutting or restructuring taxes, so no tag is applied."
