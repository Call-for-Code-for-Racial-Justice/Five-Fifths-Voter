  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Dartmouth Q&A: Ayotte's 'obsession with fossil fuels and refusal to embrace renewable energy and energy efficiency' is wrong. Valley News: favors renewables over nuclear, which she calls 'a decade away,' and would invest in renewables right away. Concord Monitor: wants a moratorium on data centers. Mix of investment and regulation does not map to one tag without inference."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Immigration"
        note: "Opposes the planned federal ICE detention facility in Merrimack and says Ayotte must say whether she supports it [WMUR 00:00:41-00:00:53]; campaign site says she will say no to ICE's 'human warehouse.' No broader immigration policy found."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Housing"
        note: "Calls housing supply a 'red-alert issue' and wants to invest in the affordable housing fund to draw federal matching dollars and restore Housing Champions funding (Dartmouth Q&A); would 'put some guardrails on private equity' buying NH properties and criticizes HB 60 on no-cause evictions (Valley News)."
        coverage: 3
        position_tag: "Increase government programs"
        position_type: "pos"
        source: [1, 2]
