  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Affordability is the campaign's central theme. In the WMUR interview she says NH 'cannot take two more years of Kelly Ayotte driving up the cost of everything' [00:00:17]; the campaign site names groceries, housing, electricity and property taxes. Specific proposals appear under other topics; no single overall approach is stated."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Taxation"
        note: "Campaign site says she will work to ensure NH has no sales or income tax, and its Priorities page carries the headline 'Suspend the gas tax' with no further detail. Dartmouth Q&A: 'Property taxes are through the roof.' Tag rests on the gas tax headline only."
        coverage: 2
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [4, 5]
      - topic: "Small business & farming"
        note: "Campaign site says only that she will work for small businesses; Dartmouth Q&A says families and small businesses are squeezed by rising costs. No policy stated."
