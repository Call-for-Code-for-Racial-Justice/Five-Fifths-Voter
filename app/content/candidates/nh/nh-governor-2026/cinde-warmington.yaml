  callout: "Cinde Warmington is a former health care lawyer and Executive Councilor (2021-2025) who won the September 8, 2026 Democratic primary and faces Republican Gov. Kelly Ayotte. Her campaign centers on affordability: ending the school voucher program (Education Freedom Accounts), housing supply, energy costs and standing up to the Trump administration. Her campaign site also lists legalizing cannabis, a data center moratorium (Concord Monitor), and opposing the ICE facility in Merrimack; her past lobbying for Purdue Pharma has been a point of attack, and she says she regrets that work."
