      - topic: "Healthcare"
        note: "Says 'health care premiums are doubling in some cases' (Dartmouth Q&A) and blames Ayotte and Trump premium increases [WMUR 00:00:31]; campaign site pledges to stand up to Trump on health care costs. No specific coverage policy stated."
