  callout: "John James is the U.S. Representative for Michigan's 10th District, an Army combat veteran and a Detroit-area business owner, and is the Republican nominee for governor. His campaign centers on eliminating the state income tax, school accountability and parental choice, tougher enforcement on violent crime, and an ethics and transparency agenda for Lansing. He also proposes repealing or sharply reducing Michigan's 24% wholesale cannabis tax, tightening rules on unlicensed hemp-derived products, and leaving data center decisions to local communities."
