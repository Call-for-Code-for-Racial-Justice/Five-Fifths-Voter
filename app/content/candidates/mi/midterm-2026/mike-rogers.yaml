  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Rogers opposes 'Medicare for All'/free healthcare, arguing 'if you think health care is expensive now, wait till it's free,' and says he doesn't want the U.S. to adopt a fully government-run system, preferring to 'mend' the current system by removing 'artificial costs.' He cites rising ACA-era claim denial rates and opposes proposals he says would shift UAW-negotiated healthcare benefits into a government-run plan."
        coverage: 3
        position_tag: "Reduce government role"
        position_type: "pos"
        source: 2
      - topic: "Education"
        note: "Rogers describes a detailed literacy plan (3rd/4th grade reading assessments, a federally-supported 'reading reclamation' program through 12th grade, redirecting Title I funds toward struggling readers, and returning shop classes to high schools). He separately criticizes Governor Whitmer for not making school-choice options available to parents, contrasting Michigan with states that do, and calls for schools and government to 'get engaged' in expanding choice."
        coverage: 3
        position_tag: "Support school choice"
        position_type: "pos"
        source: 2
      - topic: "Broadband & infrastructure"
        note: "No direct position on broadband or general infrastructure investment found. Rogers laid out detailed conditions for supporting AI/data center projects in Michigan communities — local control, closed-loop water systems, prohibiting energy-cost pass-through to the broader community, and directing 100% of resulting tax revenue to lower residents' property taxes — a related but distinct topic outside this taxonomy; see callout."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Rogers consistently calls to 'unleash American energy,' criticizes Michigan for ranking 13th nationally in oil and gas production and having the highest electricity rates in the Midwest, and frames added energy costs and regulation as costs passed to consumers. He also contrasts himself with Democratic opponents, saying both 'support EV mandates.' Website biography cites his House Energy and Commerce Committee record promoting energy independence and reducing regulations."
        coverage: 3
        position_tag: "Prioritize energy production"
        position_type: "pos"
        source: 0
      - topic: "Immigration"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Housing"
        note: "Rogers' dedicated Housing Plan centers on 'ending excessive Democrat regulations,' rolling back overregulation with states, and creating tax-free residential construction zones to incentivize homebuilding, alongside 529 savings expansion for down payments; in interviews he frames this as helping people 'get into a house younger' with added tools and resources. The plan is primarily supply-side deregulation rather than new government spending programs."
        coverage: 3
        position_tag: "Reduce development barriers"
        position_type: "pos"
