  callout: "Mike Rogers is a former U.S. Representative and House Intelligence Committee chairman running for Michigan's open U.S. Senate seat on a platform centered on domestic energy production, deregulation, and lowering costs for families. His campaign emphasizes reversing Michigan's manufacturing and defense-industrial job losses, a detailed housing affordability plan built around tax incentives and reduced regulation, a literacy- and school-choice-focused education platform, and opposition to Medicare for All. He has also laid out detailed conditions for supporting AI data center projects (local control, closed-loop water use, no community energy-cost pass-through, and property-tax relief funded by data center tax revenue). Reviewed sources did not address his positions on criminal justice, reproductive policy, voting and elections, gun policy, LGBTQ+ policy, immigration, or general federal tax policy."
