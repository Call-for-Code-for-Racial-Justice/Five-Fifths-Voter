sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Rogers ties affordability directly to energy policy, citing Michigan's highest Midwest electricity rates and highest auto insurance in the country, and argues deregulating oil and gas production and 'unleashing American energy' will lower gas, grocery, and prescription drug prices; he also warns that failing to secure the Strait of Hormuz could push gas to $8/gallon."
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: 0
      - topic: "Taxation"
        note: "No general position on federal taxation (increase/reduce/restructure) found. Rogers discusses narrow tax-advantaged savings tools (529 plan expansion, tax-free new-construction zones) tied to housing, a plan to use AI data center tax revenue to offset residents' property taxes, and criticizes Michigan Democrats for 'the largest tax increase in state history' — but this is framed as criticism of opponents, not a stated federal tax platform."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Small business & farming"
        note: "Website biography notes that as a Michigan State Senator, Rogers 'reduced burdensome regulations on small businesses,' and that after leaving Congress he 'championed American innovation and small businesses.' Described as a past record rather than a detailed current platform."
        coverage: 2
        position_tag: "Reduce regulation"
        position_type: "pos"
        source: 4
      - topic: "Workers & wages"
        note: "Rogers repeatedly cites manufacturing job losses (cited as 30,000 in one interview, 200,000 over 32 years in another) and flat-to-declining median wages as core problems, and ties reviving Michigan's defense industrial base to job creation, but does not stake out a specific position on minimum wage, worker protections, or labor regulation."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null

