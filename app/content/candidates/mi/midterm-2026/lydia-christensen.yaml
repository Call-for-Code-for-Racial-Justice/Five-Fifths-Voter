  last_updated: "2026-08-22"
  callout: "Lydia Christensen is the Libertarian Party of Michigan's nominee for U.S. Senate, campaigning as a self-described 'civil liberties libertarian' and 'participatory economic populist' under the banner 'Unchain Michigan.' A computer scientist who grew up in the foster care system, she has built her platform heavily around ending mass government surveillance — including a proposed 'Bill of Digital Rights,' ending FISA Section 702 authority, repealing remaining Patriot Act provisions, and banning license-plate-reader and facial-recognition dragnets — alongside ending qualified immunity for police. Her platform combines traditional libertarian positions (Second Amendment support, opposition to warrantless searches) with planks less typical for the party, including an opt-in 'Medicaid for All' public option and expanded worker protections, which has drawn public criticism from some national Libertarian Party committee members. Reviewed sources did not address her positions on taxation, education, housing, small business/farming, or reproductive policy."
  links:
