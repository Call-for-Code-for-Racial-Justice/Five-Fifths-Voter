  callout: "Abdul El-Sayed is a physician and former Wayne County and Detroit Health Department director running for Michigan's open U.S. Senate seat on a platform built around getting money out of politics, taxing billionaire wealth, and passing Medicare for All. His campaign has published detailed policy plans covering economic regulation, housing, education, farming, environmental protection, and immigration (including abolishing ICE while supporting a secure, humane border process), plus a proposed 'Terms of Engagement' framework for AI data centers. He has also drawn national attention for describing Israel's conduct in Gaza as a genocide, opposing unconditional U.S. military aid to Israel, and proposing aggressive federal AI regulation, including partial public ownership requirements and a wealth-tax-funded sovereign fund. Reviewed sources did not address a general position on the criminal justice/incarceration system or on gun policy."
