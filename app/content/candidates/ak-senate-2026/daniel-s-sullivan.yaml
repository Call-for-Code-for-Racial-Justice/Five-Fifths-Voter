  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Says the Working Families Tax Cuts Act had provisions 'for our health care system' (WSJ [00:15:00]), and his campaign website says he is 'strengthening Alaska's healthcare system.' Alaska's News Source notes Democratic criticism that the 2025 law harms Medicaid and SNAP recipients, which he did not address. No specific position on coverage, Medicaid, or insurance was found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Education"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Broadband & infrastructure"
        note: "Champions the King Cove road through the Izembek refuge, saying 'we got all the permits. It's ready to go' (Ruthless [00:26:59]-[00:31:00]). Calls for federal permitting (NEPA) reform so that 'a road, a bridge, a gold mine' can be built faster (WSJ [00:25:27]), and cites Coast Guard investment ($25 billion, four icebreakers homeported in Alaska) and military construction funding (Ruthless [00:15:12]-[00:16:20]). His focus is on removing permitting barriers rather than on public versus private funding, so no tag is applied."
        coverage: 3
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Central campaign theme: 'We want to unleash Alaska's energy resources, critical minerals, oil and gas' (Ruthless). Cites opening ANWR and NPR-A and mandatory federal oil and gas lease sales in Alaska for 10 years in the 2025 law (Ruthless [00:12:45]-[00:13:04]), NEPA permitting reform (WSJ [00:25:27]), and the Alaska gas line (Alaska's News Source). At the AOGA forum he backed permitting timelines (Rebuild America Now Act) and litigation reform (SPEED Act), said the Endangered Species Act has 'a good goal' but has been used to block development (Alaska Journal of Commerce), and said Peltola's election would empower those who 'want to shut us down' (Alaska Public Media). His campaign website calls for an 'all-of-the-above energy strategy.'"
        coverage: 3
        position_tag: "Prioritize energy production"
        position_type: "pos"
        source: [0, 1, 3, 4, 6, 9]
      - topic: "Immigration"
        note: "Praised Trump administration enforcement: 'Americans don't have any question about what the president just did, which was to secure the border,' and cited nearly $100 billion for detention facilities, immigration judges, and deportation. He acknowledged some deportation cases 'can be heart wrenching' (Alaska's News Source, Feb. 2026)."
        coverage: 3
        position_tag: "Stricter enforcement"
        position_type: "pos"
        source: [5]
