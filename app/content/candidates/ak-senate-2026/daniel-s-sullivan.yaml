        note: "Criticized his opponent for opposing a defense bill after Republicans 'gutted the Biden woke policies' that focused 'on issues like transgender surgeries for our troops as opposed to lethality' (WSJ interview [00:17:42]). A single reference limited to the military."
        coverage: 1
