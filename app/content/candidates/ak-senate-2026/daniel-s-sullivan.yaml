  callout: "Two-term Republican incumbent seeking a third term, former Alaska attorney general and natural resources commissioner, and Marine Corps Reserve colonel. His campaign centers on an 'Alaska comeback' built on oil, gas and mineral development, the Working Families Tax Cuts Act, federal permitting and litigation reform, and military and Coast Guard investment in Alaska. He also emphasizes fisheries (salmon bycatch, USDA access for fishermen) and a dispute over a second candidate named Daniel Sullivan (Daniel J. Sullivan) on the ballot."
  data_note: "Every source was checked to confirm it refers to the incumbent, Daniel S. Sullivan, and not Daniel J. Sullivan, who is also on the ballot."
