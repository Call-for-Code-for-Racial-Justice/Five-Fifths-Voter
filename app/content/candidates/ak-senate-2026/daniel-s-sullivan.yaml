      - topic: "Voting & elections"
        note: "Opposes Alaska's ranked choice voting and top-four primary, calling it a 'terrible, goofy' system 'prone to manipulation' (WSJ interview [00:11:08]-[00:12:18]). He argues the candidacy of a second Daniel Sullivan is a ballot-confusion tactic and that candidates should be required to run in good faith (Ruthless [00:03:55]-[00:07:25]; WSJ). This does not map to ballot access or voter verification, so no tag is applied."
        coverage: 2
        position_tag: null
