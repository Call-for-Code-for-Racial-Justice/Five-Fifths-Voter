sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Ties lower costs to energy production: 'getting good jobs through those jobs, lowering costs when we're able to produce our own energy' (WSJ interview [00:16:14]). At the Kodiak debate he said Alaska's high diesel costs 'have to be resolved by producing Alaska energy for Alaskans' (ADN). He also cited added LIHEAP heating-assistance funding as a past accomplishment."
        coverage: 2
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: [1, 2]
      - topic: "Taxation"
        note: "Runs on the Working Families Tax Cuts Act (the 2025 budget law), saying 'no state did better than Alaska in that bill' (Ruthless [00:14:05]; WSJ [00:14:41]) and citing 'tax cuts for working families [and] tax cuts for seniors' (Alaska's News Source, Jan. 2026). His campaign website calls it 'the biggest tax cut in American history.'"
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 1, 6, 8]
      - topic: "Small business & farming"
        note: "At the Kodiak debate he said that 'for over 100 years, farmers had policy programs... our fishermen never got access,' and cited his push for a new USDA Office of Seafood, a salmon research task force, and banning Russian and Chinese seafood imports (ADN). He says he has a bycatch bill pending in the Commerce Committee (WSJ [00:24:57])."
        coverage: 2
        position_tag: "Increase government support"
        position_type: "pos"
        source: [1, 2]
      - topic: "Workers & wages"
        note: "Talks about jobs from resource development and military construction (e.g. about 4,000 jobs from $2.6 billion in Alaska military construction, WSJ [00:18:54]), but no position on wages, minimum wage, or labor rules was found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

