        source: null
      - topic: "Broadband & infrastructure"
        note: "The campaign energy plan calls for targeted federal investment to modernize aging energy grids statewide, including the Railbelt, and federal funding for village micro-grids and rural energy distribution. Her affordability plan would restore funding for Bypass Mail, and she supports building the King Cove road through the Izembek refuge, which she called a 'measly 11-mile gravel road' (ADN). No position on broadband found in reviewed sources."
        coverage: 2
        position_tag: "Increase public investment"
        position_type: "pos"
        source: [3, 5, 6]

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "The campaign energy plan supports oil and gas development, including the Alaska LNG pipeline, more in-state refining and permitting reform, alongside restoring federal tax credits for solar, wind and hydropower and expanding investment in geothermal, biomass and small modular reactors. Her fisheries plan includes banning factory trawling and keeping mid-water trawlers off the ocean bottom. At the AOGA forum she supported Willow and NPR-A lease sales (Alaska Public Media), backed codifying the 2025 Supreme Court NEPA ruling, and said 'we have to make sure that we continue to balance conservation and development' (ADN). She opposed an ESA listing for Alaska king salmon and voted against the 2024 Alaska's Right to Produce Act to protect the Northern Bering Sea Climate Resilience Area (ADN)."
        coverage: 3
        position_tag: "Balance both"
        position_type: "pos"
        source: [2, 3, 6, 8]
      - topic: "Immigration"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Housing"
        note: "The campaign plan proposes refundable federal tax credits for renters paying more than 30% of income in rent, expanding Indian Housing Block Grants to build homes in high-need villages, cracking down on out-of-state corporations and hedge funds buying homes, and additional taxes on non-resident foreign purchases of residential real estate. The veterans plan adds support for permanent supportive housing, VA home loans and more federal funding for veteran housing. In the podcast she said municipalities 'can't solve homelessness alone' while federal and state programs are cut [01:13:38]-[01:13:57]."
        coverage: 3
        position_tag: "Increase government programs"
        position_type: "pos"
        source: [0, 5, 9]
