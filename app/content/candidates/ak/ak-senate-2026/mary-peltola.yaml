  callout: "Mary Peltola is a Democrat and former U.S. Representative for Alaska, a former state legislator from the Kuskokwim region who worked for the Kuskokwim River Inter-Tribal Fish Commission. Her campaign site lays out five priority plans: affordability, energy, fisheries (including a ban on factory trawling), veterans and servicemembers, and government ethics reform with 12-year congressional term limits, a congressional stock trading ban and a constitutional amendment overturning Citizens United. In the reviewed sources she also supports Alaska oil and gas projects such as Willow and describes strong personal support for Second Amendment rights."
