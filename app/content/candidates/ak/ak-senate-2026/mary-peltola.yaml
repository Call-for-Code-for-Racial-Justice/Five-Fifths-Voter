sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Affordability is her central theme. On MS NOW she cited gas at over $5 in Anchorage and $26.82 a gallon in Shungnak and said families choose 'between heat and food' [00:01:27]-[00:05:49]. In the podcast she opposed grocery mergers, saying Alaska needs 'at least two competitors' [01:14:11]. Her campaign plan pairs government measures (an Expanded Child Tax Credit of $3,600 per child under six and $3,000 for ages 6-17, a ban on price gouging, blocking anti-competitive grocery mergers, restored Bypass Mail funding and a new Essential Freight Service, expanded LIHEAP heating aid) with supply-side and market-oriented measures (permitting reform and targeted tax credits for in-state refining, cutting red tape to open childcare businesses, tax incentives for companies that pay fair wages)."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [0, 1, 5, 6]
      - topic: "Taxation"
        note: "Campaign plan: cut taxes for more than half of Alaskans and eliminate federal income tax for working and middle-class Alaskans earning under $92,000 a year, paid for by raising taxes on millionaires and billionaires. It also proposes ending taxes on Social Security benefits, an Expanded Child Tax Credit, refundable tax credits for renters, and additional taxes on non-resident foreign purchases of residential real estate. The package lowers taxes for lower and middle earners while raising them on top earners and foreign buyers."
        coverage: 3
        position_tag: "Restructure tax system"
        position_type: "pos"
        source: [4, 5]
      - topic: "Small business & farming"
        note: "The campaign plan proposes cutting red tape and expanding grants, forgivable loans and tax credits to make it easier to open childcare businesses, plus federal grants to build a fish by-product industry and federal funding to grow mariculture (farming kelp and shellfish). In the podcast she mentioned incentivizing 'the mom and pops' to get bycatch-reducing equipment such as rollers, cameras and lights [00:11:35]. These are sector-specific proposals that rely on federal financial support. No general small business or farming platform found in reviewed sources."
        coverage: 2
        position_tag: "Increase government support"
        position_type: "pos"
        source: [0, 5, 8]
      - topic: "Workers & wages"
        note: "The campaign plan says she will push for real wage increases by creating tax incentives for companies that pay fair wages and by holding large corporations accountable for prioritizing executive bonuses over worker pay. No minimum wage, worker protection or labor deregulation proposal found in reviewed sources. The tax incentive and corporate accountability approach does not fit the other tags."
        coverage: 2
        position_tag: "Centrist or alternative approach"
        position_type: "pos"
        source: [4, 5]

