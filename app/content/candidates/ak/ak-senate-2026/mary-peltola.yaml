  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "On MS NOW she said Alaskans pay 'the highest price for health care' in the U.S. and are worried about paying for it [00:06:01]. In the podcast she cited 'massive spikes in our health insurance' and asked 'where are our advocates there?' [01:14:02]. The campaign's veterans plan commits to restoring the VA clinical workforce, modernizing VA infrastructure and electronic health records, holding the VA accountable for timely care and expanding mental healthcare for veterans. No general healthcare coverage or insurance policy found in reviewed sources."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Education"
        note: "No position found in reviewed sources."
        coverage: 0
        position_tag: null
