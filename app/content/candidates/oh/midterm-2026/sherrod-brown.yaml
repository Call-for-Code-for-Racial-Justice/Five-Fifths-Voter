sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Campaign page opens with 'Life is too expensive' and lists capping utility rate increases, making it illegal for drug companies to charge Americans more than other countries, and fining insurers that deny care. In the Cohen interview he supports capping health insurance premiums and restoring the child tax credit. Mechanisms named are price caps, regulation and a tax credit program."
        coverage: 3
        position_tag: "Government programs"
        position_type: "pos"
        source: [1, 2]
      - topic: "Taxation"
        note: "Opposes tax cuts for billionaires and large corporations and criticizes tax breaks for data center developers (WSAZ, Cohen, campaign page). Supports restoring the child tax credit (Cohen). No reviewed source states a position to increase taxes or restructure the tax system, so no tag applied."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Small business & farming"
        note: "Says Husted has done nothing for farmers and that a small business owner lost insurance when premiums doubled (WSAZ). In the Cohen interview he cites higher diesel and fertilizer costs and lost markets for farmers, criticizes tariffs, and says family farm conditions affect the whole rural economy. No stated policy on government support or regulation, so no tag applied."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Workers & wages"
        note: "Centers his campaign on workers having a voice, citing his Dignity of Work Institute and saying workers earning $15 to $18 an hour struggle despite higher productivity (WSAZ, Cohen). No reviewed source states a position on minimum wage, worker protections or labor regulation, so no tag applied."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null

