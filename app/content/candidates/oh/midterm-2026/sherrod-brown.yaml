  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Campaign page calls for banning insurers from denying care a doctor says is needed, fining insurers that try, and making it illegal for drug companies to charge Americans more than other countries. In WSAZ he opposes Medicaid cuts and says rural hospital closures hurt communities. In Cohen he says Husted voted nine times against capping premiums and that the VA is underfunded. His approach centers on regulating insurers and drug prices and protecting existing coverage. No proposal to expand coverage eligibility was found."
        coverage: 3
        position_tag: "Centrist or alternative approach"
        position_type: "pos"
        source: [0, 1, 2]
      - topic: "Education"
        note: "Says Ohio should fund public education better and that community colleges need enough funding for people to learn a trade and stay in their communities. Criticizes state education spending cuts and says war spending underfunds education (WSAZ, Cohen). No specifics on school choice."
        coverage: 2
        position_tag: "Increase public school funding"
        position_type: "pos"
        source: [0, 1]
      - topic: "Broadband & infrastructure"
        note: "Single passing reference that the country is underfunding highways because of war and tax cut spending (Cohen). No stated position on broadband or on public versus private infrastructure investment, so no tag applied."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Campaign page says he would require data centers to pay the full cost of their utilities, cap utility rate increases, and let Ohioans decide whether data centers are built locally. In WSAZ he raises water, jobs and electric rates as data center concerns and wants developers to be more responsible to local communities. In Cohen he calls for restoring cancelled clean energy projects and says the EPA is underfunded."
        coverage: 3
        position_tag: "Prioritize regulation"
        position_type: "pos"
        source: [0, 1, 2]
