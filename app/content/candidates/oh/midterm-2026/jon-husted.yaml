  callout: "Jon Husted is the incumbent Republican U.S. senator from Ohio, appointed in 2025 after JD Vance became vice president, and previously served as lieutenant governor, secretary of state and Ohio House speaker. In the reviewed sources he emphasizes jobs and business competitiveness, tax cuts for working families, domestic energy production, immigration enforcement and his Ratepayer Protection Act, which would require data centers to pay for their own electricity infrastructure. Positions outside the taxonomy include the Iran war, where he says it should end on terms acceptable to the United States and that Iran should not have a nuclear weapon or control the Strait of Hormuz, and his TEAM USA Act, which would cap non-American athletes at 20 percent of college rosters."
