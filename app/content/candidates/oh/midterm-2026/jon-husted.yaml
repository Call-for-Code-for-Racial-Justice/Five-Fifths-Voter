sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Says the working family tax cut plan lets people keep more of their pay, citing no tax on tips or overtime, lower taxes on Social Security and a $2,200 per child tax credit, and says he would also lower prices for groceries, housing and fuel (C-SPAN, Local 12). Backs more domestic oil and gas supply to meet demand (C-SPAN, Guy Benson Show). Also says his Ratepayer Protection Act would require data centers to pay for their own electricity infrastructure and generation so costs are not passed to ratepayers (C-SPAN, Guy Benson Show). Market-oriented tax and supply measures are paired with a federal requirement on data centers."
        coverage: 3
        position_tag: "Addresses both directions"
        position_type: "mixed"
        source: [0, 1, 2]
      - topic: "Taxation"
        note: "Cites the working family tax cut plan: no tax on tips or overtime, lower taxes on Social Security, a $2,200 per child tax credit and tax credits so families can afford child care (C-SPAN, Local 12). Says good tax policy should also encourage businesses to invest in machinery and equipment (C-SPAN). Campaign site cites his record as Ohio House Speaker, passing what it calls the largest income tax cut in Ohio history at the time."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [0, 1, 3]
      - topic: "Small business & farming"
        note: "Speaks about business competitiveness generally: cites past workers' comp, tort and tax reform, says tax and energy policy should help businesses invest and compete, and says the Ohio economy has grown (C-SPAN). Campaign site cites his record as Secretary of State making Ohio the least costly Midwest state to start and maintain a business, and lists NFIB and Ohio Cattlemen's Association endorsements. No stated position on government support or regulation specific to small business or farming found in reviewed sources."
        coverage: 2
