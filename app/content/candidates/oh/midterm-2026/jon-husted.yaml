        source: null
      - topic: "Workers & wages"
        note: "Emphasizes job creation, job skills training and keeping more of workers' pay through no tax on tips or overtime (C-SPAN, Local 12). The campaign site cites TechCred and Industry Sector Partnerships and lists several labor union endorsements. No position found on minimum wage, worker protections or labor regulation in reviewed sources."
        coverage: 2
