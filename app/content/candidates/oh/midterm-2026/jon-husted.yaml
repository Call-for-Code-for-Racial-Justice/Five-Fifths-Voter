    items:
      - topic: "Environment & energy"
        note: "Says Republicans are the party of 'drill baby drill' and more supply to meet demand, including pipelines and coal- and gas-fired power plants, and says the country needs enough energy to meet demand (C-SPAN, Guy Benson Show). Faults Democrats for opposing the Keystone pipeline and his opponent for a 2012 vote he says allowed 23 Ohio power plants to be shut down (C-SPAN, Guy Benson Show). Says domestic fuel supply is keeping prices lower (Local 12). Sponsors the Ratepayer Protection Act on data center electricity costs."
