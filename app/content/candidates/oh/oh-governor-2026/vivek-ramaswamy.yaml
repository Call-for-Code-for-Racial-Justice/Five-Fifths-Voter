sections:
  - id: "economic-security"
    title: "Economic security"
    items:
      - topic: "Cost of living"
        note: "Campaign site: 'Vivek wants Ohio to be the most affordable state in America' by cutting government bloat and red tape. In the WTOL interview he rejects 'government entitlements and greater dependence on the government' as a 'band-aid' and says growth from more people and companies is the answer [00:06:01-00:06:12]. In the WCPO interview he ties affordability to tax cuts and energy production [00:03:14]."
        coverage: 3
        position_tag: "Market-driven solutions"
        position_type: "pos"
        source: [2, 5]
      - topic: "Taxation"
        note: "Wants to phase out the state income tax, starting with eliminating capital gains tax, and to roll property taxes back 'in aggregate' to pre-pandemic levels and cap future growth (Statehouse News Bureau, Sept. 4, 2026; campaign property tax page). In the first interview: 'bring down the tax burden, including the income tax eventually down to zero' [00:00:25]."
        coverage: 3
        position_tag: "Reduce taxes"
        position_type: "pos"
        source: [1, 3, 5, 8]
      - topic: "Small business & farming"
        note: "Campaign site: 'Slash red tape that drives up costs and stalls business growth.' In interview he says a natural gas pipeline permit takes 18 to 36 months and 'should be and can be 6 months' [00:13:47]. Property tax page promises relief for farmers and rural communities; data center pledge protects farmland."
        coverage: 3
        position_tag: "Reduce regulation"
        position_type: "pos"
        source: [1, 5, 8]
      - topic: "Workers & wages"
        note: "Mentions union endorsements and says policy will keep high-paying jobs in Ohio, but no wage, minimum wage, or labor-regulation position was found in reviewed sources. No position found in reviewed sources."
        coverage: 1
        position_tag: null
        position_type: "none"
        source: null

  - id: "civil-rights-justice"
    title: "Civil rights & justice"
    items:
      - topic: "Criminal justice system"
        note: "Calls for 'law and order,' stricter bail and sentencing for repeat violent offenders, and to 'back the blue' [WCPO 00:21:57-00:22:14]. Campaign site: 'Enforce stricter bail and sentencing for repeat violent offenders' and empower local police and sheriffs. Supports the death penalty for 'only the most heinous' cases [WCPO 00:09:04]."
        coverage: 3
        position_tag: "Increase enforcement"
        position_type: "pos"
        source: [0, 5]
      - topic: "Reproductive policy"
        note: "'I'm pro-life. I believe strongly in my pro-life views,' and says that after the 2023 ballot loss he would focus on family formation and supporting parents rather than new restrictions [Full Interview 00:05:28]. In the News 5 interview he again declined to discuss specific bills. No exceptions or specific legislation were stated."
        coverage: 2
