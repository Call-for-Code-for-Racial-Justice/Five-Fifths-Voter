  callout: "Vivek Ramaswamy is a businessman and author who founded Roivant Sciences and ran for the 2024 Republican presidential nomination; he is the Republican nominee for Ohio governor with Rob McColley as his running mate. His campaign centers on eliminating the state income tax over time, a property tax rollback to pre-pandemic levels, school standards and teacher merit pay, energy permitting, and public safety. He has also proposed conditions on data centers, a plan to cut Medicaid fraud, a 90-day gas tax suspension, and supports the death penalty in the most heinous cases."
