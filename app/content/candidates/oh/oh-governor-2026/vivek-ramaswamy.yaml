  - id: "access-services"
    title: "Access & services"
    items:
      - topic: "Healthcare"
        note: "Campaign Medicaid plan targets waste, fraud and abuse: seek a federal CMS demonstration project so Ohio keeps at least $0.65 per $1 saved, simplify agencies, and prioritize fraud prosecution, with savings aimed at lowering healthcare costs. This addresses one angle (Medicaid fraud) and no broader coverage or insurance position was found."
        coverage: 2
        position_tag: null
        position_type: "none"
        source: null
      - topic: "Education"
        note: "Supports school choice for public, charter or homeschool, while also making public schools 'equipped to compete with the best of the alternatives' through merit-based teacher pay [WTOL 00:02:55-00:03:30]. Also third-grade literacy requirements, civics standards and a long-run statewide funding component to reduce reliance on local property taxes (Sept. 4, 2026 interview)."
        coverage: 3
        position_tag: "Both public and choice"
        position_type: "pos"
        source: [0, 1, 2, 3]
      - topic: "Broadband & infrastructure"
        note: "No position found in reviewed sources. He discussed a Columbus-to-Toledo transportation corridor and Toledo's airport in general terms [WTOL 00:05:46, 00:09:17], with no investment model stated."
        coverage: 1
        position_tag: null
        position_type: "none"
