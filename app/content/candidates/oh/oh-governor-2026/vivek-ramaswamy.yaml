  - id: "community-environment"
    title: "Community & environment"
    items:
      - topic: "Environment & energy"
        note: "Wants faster permitting and 'all of the above' energy including natural gas, coal and nuclear, plus small modular reactors [WTOL 00:13:54; Full Interview 00:14:16]. Opposes federal subsidies for electric vehicles [WTOL 00:13:46]. His data center pledge also sets strict air and water standards and farmland protection, and a day-one executive order would require new data centers to generate their own power (Sept. 4, 2026)."
        coverage: 3
